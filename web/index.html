<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenXP</title>
<style>
:root{--bg:#effaf5;--card:#fff;--ink:#0e3b36;--mute:#4f7a73;--line:#cfe9df;--pri:#19b37a;--prid:#0f8a5c;--xp:#ffc83d}
@media(prefers-color-scheme:dark){:root{--bg:#0a1f1c;--card:#12322d;--ink:#e6f6f1;--mute:#8fbdb3;--line:#1f4a43}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
.app{max-width:520px;margin:auto;padding:1rem 1rem 5.5rem}h1,h2,h3{margin:.2rem 0 .5rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.7rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem}.mute{color:var(--mute);font-size:.9rem}
button{font:700 1rem system-ui;border:0;border-radius:12px;padding:.65rem 1rem;background:var(--pri);color:#fff;cursor:pointer;border-bottom:3px solid var(--prid)}
button.o{background:transparent;color:var(--prid);border:2px solid var(--line)}button.s{padding:.35rem .8rem;font-size:.9rem}
input,select{width:100%;font:inherit;padding:.65rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:.2rem 0 .6rem}
.pill{background:var(--xp);color:#4a3500;border-radius:99px;padding:.1rem .6rem;font-weight:700;font-size:.85rem}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:safe center;overflow-x:auto;gap:.3rem;background:var(--card);border-top:2px solid var(--line);padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;color:var(--mute);border:0;padding:.4rem .7rem;flex-shrink:0;white-space:nowrap}.tabs button.on{color:var(--prid);background:var(--line)}
.app.wide{max-width:960px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-bottom:.7rem}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:.8rem}.stat b{display:block;font-size:1.7rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.7rem}.grid .card{margin:0}
.proof{width:100%;height:190px;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block;margin-bottom:.5rem;background:var(--line)}
.noproof{height:60px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:10px;margin-bottom:.5rem}
.warn{background:#fff3cd;color:#664d03;border-radius:10px;padding:.4rem .6rem;font-size:.9rem;margin:.4rem 0}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:9;cursor:zoom-out}.lb img{max-width:95vw;max-height:90vh;border-radius:10px}
dialog{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;width:min(420px,92vw)}dialog::backdrop{background:rgba(0,0,0,.5)}
textarea{width:100%;font:inherit;padding:.65rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:.2rem 0 .6rem}
.err{color:#b3261e;font-weight:700}.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
</style></head>
<body><div class="app" id="app">Loading…</div><nav class="tabs" id="tabs" hidden></nav>
<div class="lb" id="lb" hidden onclick="this.hidden=true"><img alt="Proof photo, full size"></div>
<dialog id="rj"><form method="dialog"><h3>Reason for rejection</h3><p class="mute">The student sees this reason.</p>
  <label for="rjs">Common reasons</label><select id="rjs"><option value="">Choose a reason…</option><option>Photo doesn't show the activity</option><option>Photo is unclear or too dark</option><option>Same photo was used before</option><option>Doesn't meet the activity rules</option></select>
  <label for="rjt">Or write your own</label><textarea id="rjt" rows="3" maxlength="500"></textarea>
  <div class="row"><button value="cancel" class="o">Cancel</button><button value="ok">Reject</button></div></form></dialog>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const db = supabase.createClient(GXP.SUPABASE_URL, GXP.SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const LV = [[0,"Eco Starter","🌱"],[100,"Green Rookie","🍃"],[300,"Green Warrior","🌿"],[600,"Eco Champion","🌳"],[1000,"Planet Hero","🌎"],[2000,"Eco Legend","🏆"]];
let me = null, tab = "home", acts = {};
async function api(path, body, method = "POST") {
  const { data: { session } } = await db.auth.getSession();
  if (!session) throw new Error("Your session has expired. Please log in again.");
  const r = await fetch(GXP.API_URL + path, { method, headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
const say = (m, bad) => { const e = $("msg"); if (e) { e.textContent = m; e.className = bad ? "err" : "mute"; } };
const currentYear = async () => (await db.from("academic_years").select("id").eq("college_id", me.college_id).eq("is_current", true).maybeSingle()).data;

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return authScreen();
  me = (await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle()).data;
  if (!me) {
    $("tabs").hidden = true;
    $("app").innerHTML = `<div class="card"><p>Your account is still being set up.</p><button onclick="init()">Try again</button> <button class="o" onclick="db.auth.signOut().then(init)">Log out</button></div>`;
    return;
  }
  // Admins manage the college and go straight to their dashboard; the onboarding steps below are for students.
  if (["admin", "super_admin"].includes(me.role)) { $("tabs").hidden = false; return show("admin"); }
  if (!me.usn || !me.department) return profileScreen();
  me.survey = (await db.from("lifestyle_surveys").select("*").eq("user_id", me.id).maybeSingle()).data;
  if (!me.survey) return surveyScreen();
  // Only a membership for the current academic year unlocks the app.
  const y = await currentYear();
  const { data: m } = y ? await db.from("memberships").select("status").eq("user_id", me.id).eq("academic_year_id", y.id).in("status", ["active", "waived"]).limit(1) : { data: null };
  if (!m || !m.length) return payScreen(y);
  $("tabs").hidden = false; show("home");
}
async function authScreen() {
  $("tabs").hidden = true;
  const { data: cs } = await db.from("colleges").select("id,name");
  $("app").innerHTML = `<h1>🌱 GreenXP</h1><p class="mute">Earn XP. Go Green. Make an Impact.</p><div class="card">
  <label>College</label><select id="col">${(cs||[]).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
  <label>Full name (sign-up only)</label><input id="nm"><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password">
  <div class="row"><button onclick="signup()">Sign up</button><button class="o" onclick="login()">Log in</button></div><p id="msg"></p></div>`;
}
async function signup() {
  const { error } = await db.auth.signUp({ email: $("em").value, password: $("pw").value, options: { data: { full_name: $("nm").value, college_id: $("col").value } } });
  if (error) return say(error.message, 1);
  say("Account created. If email confirmation is on, check your inbox, then log in.");
}
async function login() {
  const { error } = await db.auth.signInWithPassword({ email: $("em").value, password: $("pw").value });
  error ? say(error.message, 1) : init();
}
function profileScreen() {
  $("app").innerHTML = `<h2>Your details</h2><div class="card"><label>USN</label><input id="usn"><label>Department</label>
  <select id="dep">${["CSE","ISE","ECE","EEE","ME"].map(d => `<option>${d}</option>`).join("")}</select>
  <label>Year</label><input id="yr" type="number" min="1" max="4" value="1"><label>Mobile (never shown publicly)</label><input id="ph">
  <label><input type="checkbox" id="ok" style="width:auto"> I accept the Terms, Privacy and Refund policies and understand points are not carbon credits.</label>
  <p><button onclick="saveProfile()">Continue</button></p><p id="msg"></p></div>`;
}
async function saveProfile() {
  if (!$("usn").value.trim() || !$("ok").checked) return say("Add your USN and accept the terms.", 1);
  const { error } = await db.from("profiles").update({ usn: $("usn").value.trim(), department: $("dep").value, year: +$("yr").value, phone: $("ph").value }).eq("id", me.id);
  error ? say(error.message, 1) : init();
}

// Baseline lifestyle questionnaire: [section, [[id, question, [[value, label], ...]], ...]]
const SURVEY = [
  ["🏠 Home", [
    ["household", "How many people share your home (or hostel room)?", [["1","Just me"],["2","2"],["4","3–4"],["6","5 or more"]]],
    ["residence", "Where do you live?", [["hostel","Hostel / PG"],["apartment","Apartment / flat"],["house","Independent house"]]]]],
  ["🚌 Travel", [
    ["mode", "How do you usually travel to college?", [["walk","Walk / cycle"],["public","Bus / metro / train"],["two","Two-wheeler"],["auto","Auto / cab"],["car","Car"]]],
    ["distance", "Typical daily round-trip distance?", [["3","Under 5 km"],["10","5–15 km"],["22","15–30 km"],["40","Over 30 km"]]]]],
  ["⚡ Energy", [
    ["units", "Household electricity use per month?", [["75","Under 100 units (bill under ₹500)"],["150","100–200 units (₹500–1,200)"],["300","200–400 units (₹1,200–3,000)"],["500","Over 400 units (over ₹3,000)"],["0","Don't know"]]],
    ["cooking", "Main cooking fuel where you eat?", [["lpg","LPG cylinder"],["png","Piped gas (PNG)"],["electric","Electric / induction"],["biomass","Wood / biomass"],["mess","I eat at a mess / canteen"]]]]],
  ["🍽 Food", [
    ["diet", "Which best describes your diet?", [["vegan","Vegan"],["veg","Vegetarian"],["egg","Vegetarian + eggs"],["nonveg_some","Non-veg a few times a week"],["nonveg_daily","Non-veg daily"]]],
    ["waste", "How often is food wasted on your plate or at home?", [["rare","Rarely"],["sometimes","Sometimes"],["often","Often"]]],
    ["delivery", "How often do you order food delivery?", [["rare","Rarely"],["weekly","About once a week"],["often","Several times a week"]]]]],
  ["🛍 Shopping", [
    ["clothes", "New clothes bought per year?", [["low","0–5 items"],["mid","6–15 items"],["high","16+ items"]]],
    ["online", "Online orders per month?", [["low","0–2"],["mid","3–8"],["high","9+"]]],
    ["devices", "How often do you replace your phone or laptop?", [["low","Every 4+ years"],["mid","Every 2–3 years"],["high","Every year"]]]]],
  ["💧 Water & waste", [
    ["bath", "How do you usually bathe?", [["bucket","Bucket"],["short","Shower, under 10 min"],["long","Shower, over 10 min"]]],
    ["segregate", "Do you separate wet and dry waste?", [["always","Always"],["sometimes","Sometimes"],["never","Never"]]],
    ["plastic", "How often do you use single-use plastic (bags, bottles, cups)?", [["rare","Rarely"],["sometimes","Sometimes"],["daily","Daily"]]]]]
];
// Footprint categories, with the tip and matching activity categories shown when it is one of a student's biggest.
const CATS = {
  Energy:    { label: "Energy", icon: "⚡", acts: ["Energy"], tip: "Switch off fans, lights and chargers when you leave a room, keep the AC at 24–26 °C, and pick LED and 5-star appliances." },
  Transport: { label: "Transport", icon: "🚌", acts: ["Transport"], tip: "Walk, cycle or take the bus or metro for some trips, and share rides when you can't." },
  Food:      { label: "Food", icon: "🍽", acts: ["Food"], tip: "Take only what you'll eat, try more plant-based meals, and cook or eat at the mess instead of ordering in." },
  Shopping:  { label: "Shopping", icon: "🛍", acts: ["Reuse", "Recycling"], tip: "Buy fewer, longer-lasting clothes, repair before replacing, and recycle old electronics properly." },
  Water:     { label: "Water & waste", icon: "💧", acts: ["Water", "Waste"], tip: "Use a bucket or keep showers short, segregate waste, and carry a reusable bottle and bag." }
};
const INDIA_AVG_T = 1.9; // approx. per-person tonnes CO2e per year in India
const GRID = 0.71; // kg CO2 per kWh, Indian grid average
// Rough yearly kg CO2e per person from the questionnaire, per logging category, using typical Indian emission factors.
function baseline(a) {
  const hh = +a.household;
  const units = +a.units || { hostel: 40, apartment: 50, house: 70 }[a.residence] * hh; // "don't know": typical per-person use
  const cook = { lpg: 340, png: 300, electric: 0, biomass: 400 }; // per household per year
  return {
    transport: +a.distance * 300 * { walk: 0, public: 0.03, two: 0.05, auto: 0.12, car: 0.17 }[a.mode], // ~300 travel days
    electricity: units * 12 * GRID / hh,
    cooking: a.cooking === "mess" ? 100 : cook[a.cooking] / hh,
    food: { vegan: 700, veg: 900, egg: 1000, nonveg_some: 1200, nonveg_daily: 1600 }[a.diet]
      + { rare: 0, sometimes: 50, often: 150 }[a.waste] + { rare: 0, weekly: 50, often: 150 }[a.delivery],
    shopping: { low: 50, mid: 150, high: 350 }[a.clothes] + { low: 20, mid: 60, high: 150 }[a.online] + { low: 50, mid: 100, high: 250 }[a.devices],
    waste: { bucket: 20, short: 40, long: 80 }[a.bath] + { always: 30, sometimes: 80, never: 150 }[a.segregate] + { rare: 10, sometimes: 40, daily: 100 }[a.plastic]
  };
}
// The questionnaire's own five-category view (stored with the survey and used for the admin averages).
function footprint(a) {
  const b = baseline(a);
  const f = { Energy: b.electricity + b.cooking, Transport: b.transport, Food: b.food, Shopping: b.shopping, Water: b.waste };
  for (const k in f) f[k] = Math.round(f[k]);
  return f;
}
function surveyScreen() {
  const prev = me.survey?.answers || {};
  $("app").innerHTML = `<h2>Your green baseline</h2><p class="mute">15 quick questions about your everyday life. We use them to estimate your carbon footprint and show where you can make the biggest difference.</p>` +
    SURVEY.map(([title, qs]) => `<div class="card"><h3>${title}</h3>` + qs.map(([id, q, opts]) =>
      `<label for="q_${id}">${q}</label><select id="q_${id}"><option value="">Choose…</option>${opts.map(([v, t]) => `<option value="${v}"${prev[id] === v ? " selected" : ""}>${t}</option>`).join("")}</select>`).join("") + `</div>`).join("") +
    `<p><button onclick="saveSurvey()">See my analysis</button>${me.survey ? ` <button class="o" onclick="init()">Cancel</button>` : ""}</p><p id="msg"></p>`;
}
async function saveSurvey() {
  const a = {};
  for (const [, qs] of SURVEY) for (const [id] of qs) a[id] = $("q_" + id).value;
  if (Object.values(a).some(v => !v)) return say("Please answer every question.", 1);
  const f = footprint(a), total = Object.values(f).reduce((x, y) => x + y, 0);
  const { data, error } = await db.from("lifestyle_surveys")
    .upsert({ user_id: me.id, answers: a, footprint: f, total_kg: total, updated_at: new Date().toISOString() }).select().single();
  if (error) return say(error.message, 1);
  me.survey = data;
  analysisScreen();
}
async function analysisScreen() {
  const f = me.survey.footprint, t = me.survey.total_kg / 1000;
  const max = Math.max(1, ...Object.keys(CATS).map(k => f[k]));
  const top = Object.keys(CATS).sort((x, y) => f[y] - f[x]).slice(0, 2);
  const { data: acts } = await db.from("activities").select("name,category,xp_value").eq("active", true).in("category", top.flatMap(k => CATS[k].acts));
  const diff = Math.round((t / INDIA_AVG_T - 1) * 100);
  const cmp = Math.abs(diff) < 10 ? `About the same as India's average of ${INDIA_AVG_T} t per person.`
    : `${Math.abs(diff)}% ${diff > 0 ? "above" : "below"} India's average of ${INDIA_AVG_T} t per person.`;
  $("app").innerHTML = `<h2>Your footprint</h2><div class="card"><b style="font-size:1.8rem">${t.toFixed(1)} t CO₂e</b> <span class="mute">per year (estimate)</span><p class="mute">${cmp}</p>` +
    Object.entries(CATS).map(([k, c]) => `<div class="row"><span>${c.icon} ${c.label}</span><b>${f[k]} kg</b></div><div class="bar" style="margin:.2rem 0 .7rem"><i style="width:${Math.round(f[k] / max * 100)}%"></i></div>`).join("") + `</div>
    <h3>Where you can make the biggest difference</h3>` +
    top.map(k => `<div class="card"><b>${CATS[k].icon} ${CATS[k].label}</b><p>${CATS[k].tip}</p>` +
      (acts || []).filter(a => CATS[k].acts.includes(a.category)).map(a => `<span class="pill" style="display:inline-block;margin:.15rem 0">${esc(a.name)} +${a.xp_value} XP</span>`).join(" ") + `</div>`).join("") +
    `<p class="mute" style="font-size:.8rem">A rough estimate from typical Indian emission factors, to show where your biggest impact is. It is not a certified measurement.</p>
    <p><button onclick="init()">Continue</button> <button class="o" onclick="surveyScreen()">Retake questionnaire</button></p>`;
}

async function payScreen(y) {
  const { data: f } = y ? await db.from("fee_settings").select("amount,currency").eq("college_id", me.college_id).eq("academic_year_id", y.id).eq("active", true).maybeSingle() : { data: null };
  $("app").innerHTML = `<h2>Activate your year</h2><div class="card"><h1>₹${f ? f.amount : "-"}</h1><p class="mute">Includes XP tracking, badges, challenges, leaderboards and your annual certificate.</p>
  <button id="paybtn" onclick="pay()">Pay now</button><p id="msg"></p></div>`;
}
async function pay() {
  const b = $("paybtn");
  if (b.disabled) return;
  b.disabled = true; say("Starting payment…");
  try {
    const o = await api("/api/payments/create-order");
    say("");
    new Razorpay({ key: o.keyId, order_id: o.orderId, amount: o.amount, currency: o.currency, name: "GreenXP",
      handler: async r => { try { await api("/api/payments/verify", r); init(); } catch (e) { say(e.message, 1); } } }).open();
  } catch (e) { say(e.message, 1); }
  finally { b.disabled = false; }
}
function show(t) {
  tab = t;
  const T = ["admin","super_admin"].includes(me.role) ? [["admin","🛠 Admin"],["ranks","🏆 Ranks"]]
    : [["home","🏠 Home"],["earn","⭐ Earn"],["fp","🌍 Footprint"],["ranks","🏆 Ranks"],["cert","🎓 Certificate"]];
  $("tabs").innerHTML = T.map(x => `<button class="${x[0]==t?"on":""}" onclick="show('${x[0]}')">${x[1]}</button>`).join("") + `<button onclick="db.auth.signOut().then(init)">Out</button>`;
  $("app").classList.toggle("wide", t === "admin");
  ({ home, earn, fp, ranks, cert, admin })[t]();
}
async function home() {
  const { data } = await db.rpc("my_xp_summary"); const s = data && data[0] || { earned: 0, spendable: 0, year_earned: 0 };
  const e = +s.earned, l = [...LV].reverse().find(x => e >= x[0]), n = LV.find(x => x[0] > e), p = n ? Math.round((e - l[0]) / (n[0] - l[0]) * 100) : 100;
  $("app").innerHTML = `<h2>Hi ${esc((me.full_name||"").split(" ")[0])} ${l[2]}</h2><div class="card"><div class="row"><b style="font-size:1.8rem">${e} XP</b><span class="pill">${l[1]}</span></div>
  <div class="bar" style="margin:.6rem 0"><i style="width:${p}%"></i></div><span class="mute">${n ? n[0]-e+" XP to "+n[1] : "Top level"} · ${s.spendable} XP to spend · ${s.year_earned} XP this year</span></div>
  ${me.survey ? `<div class="card"><div class="row"><span>🌍 Your footprint</span><b>${(me.survey.total_kg / 1000).toFixed(1)} t CO₂e / year</b></div><p class="mute">From your questionnaire. Log your real travel, bills and meals for a more accurate figure.</p><p><button class="s" onclick="show('fp')">Open footprint dashboard</button></p></div>` : ""}
  <p class="mute">GreenXP points are reward points, not carbon credits or money.</p>`;
}
async function earn() {
  const { data, error } = await db.from("activities").select("*").eq("active", true).order("category");
  acts = Object.fromEntries((data||[]).map(a => [a.id, a]));
  if (error || !data.length) {
    $("app").innerHTML = `<h2>Earn XP</h2><p class="${error ? "err" : "mute"}">${error ? "Could not load activities. Please refresh or log in again." : "No activities yet. Check back soon."}</p>`;
    return;
  }
  $("app").innerHTML = `<h2>Earn XP</h2><p id="msg" class="mute"></p>` + data.map(a => `<div class="card row"><div><b>${esc(a.name)}</b><br><span class="mute">${esc(a.category)} · ${a.frequency_limit} per ${a.frequency_period} · ${({self:"instant",photo:"photo",photo_admin:"photo + admin",qr_event:"event code",automatic:"automatic"})[a.verification_type]}</span></div>
  ${a.verification_type==="automatic" ? '<span class="mute">Auto</span>' : `<span><span class="pill">+${a.xp_value}</span> <button class="s" onclick="doAct('${esc(a.id)}')">Go</button></span>`}</div>`).join("");
}
async function doAct(id) {
  const a = acts[id];
  if (!a) return;
  try {
    const body = { activityId: a.id };
    if (a.verification_type === "qr_event") {
      body.eventCode = prompt("Enter the event code");
      if (body.eventCode == null) return;
    }
    if (["photo", "photo_admin"].includes(a.verification_type)) {
      const f = await new Promise(r => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.capture = "environment"; i.onchange = () => r(i.files[0]); i.oncancel = () => r(null); i.click(); });
      if (!f) return;
      if (f.size > 10 * 1024 * 1024) return say("That photo is over 10 MB. Please pick a smaller one.", 1);
      const ext = ({ "image/png": "png", "image/webp": "webp", "image/heic": "heic", "image/heif": "heif" })[f.type] || "jpg";
      body.proofPath = `${me.id}/${crypto.randomUUID()}.${ext}`;
      const up = await db.storage.from("proofs").upload(body.proofPath, f, { contentType: f.type });
      if (up.error) throw up.error;
    }
    const r = await api("/api/submissions", body);
    say(r.xp ? `+${r.xp} XP!` : "Sent. XP arrives once an admin verifies it.");
  } catch (e) { say(e.message, 1); }
}
// ---- Activity logging and the footprint dashboard ----
// fields: [id, label, options | "number", default]; event categories are dated once, the others cover a period.
const LOGS = {
  transport: { label: "Transport", icon: "🚗", event: true, acts: ["Transport"], hint: "Log each trip, or a day's total distance.", fields: [

// Emission factors (kg CO2e), typical Indian values. Vehicles are per vehicle-km; public transport and flights per passenger-km.
const EF = {
  vehicle: {
    car:  { petrol: 0.17, diesel: 0.16, cng: 0.11, electric: 0.09 },
    cab:  { petrol: 0.17, diesel: 0.16, cng: 0.11, electric: 0.09 },
    two:  { petrol: 0.045, diesel: 0.045, cng: 0.04, electric: 0.02 },
    auto: { petrol: 0.08, diesel: 0.09, cng: 0.06, electric: 0.03 },
    bus: 0.03, metro: 0.02, train: 0.01, flight: 0.15 },
  cooking: { lpg: 42.3, png: 2.0, kerosene: 2.52, wood: 0.25, coal: 2.2 }, // per cylinder (14.2 kg), SCM, litre, kg, kg
  meal: { plant: 0.4, veg: 0.7, egg: 0.8, chicken: 1.4, mutton: 3.5 }, delivered: 0.3, // per meal; delivery adds packaging and transport
  item: { clothing: 15, footwear: 14, phone: 60, laptop: 250, electronics: 20, furniture: 60, books: 2, online: 1 },
  waste: { mixed: 0.6, segregated: 0.15, compost: 0.05, burned: 1.0 } // per kg
};
function logKg(cat, d) {
  const share = Math.max(1, d.people || 1);
  switch (cat) {
    case "transport": { const f = EF.vehicle[d.vehicle]; return d.km * (typeof f === "number" ? f : f[d.fuel]); }
    case "electricity": return d.kwh * GRID / share;
    case "cooking": return d.qty * EF.cooking[d.fuel] / share;
    case "food": return d.meals * EF.meal[d.meal] + Math.min(d.delivered, d.meals) * EF.delivered;
    case "shopping": return d.qty * EF.item[d.item];
    case "waste": return d.kg * EF.waste[d.method];
  }
}
function logSummary(l) {
  const d = l.details, o = (cat, id) => (LOGS[cat].fields.find(f => f[0] === id)[2].find(x => x[0] === d[id]) || [, d[id]])[1];
  switch (l.category) {
    case "transport": return `${d.km} km · ${o("transport", "vehicle")}`;
    case "electricity": return `${d.kwh} kWh${d.people > 1 ? ` ÷ ${d.people} people` : ""}`;
    case "cooking": return `${d.qty} × ${o("cooking", "fuel")}`;
    case "food": return `${d.meals} ${o("food", "meal").toLowerCase()} meals`;
    case "shopping": return `${d.qty} × ${o("shopping", "item").toLowerCase()}`;
    case "waste": return `${d.kg} kg · ${o("waste", "method").toLowerCase()}`;
  }
}
const GROUPS = [
  ["🚌 Transport", "Travel-related emissions", ["transport"]],
  ["🏠 Home energy", "Electricity and fuel emissions", ["electricity", "cooking"]],
  ["🍽 Food and consumption", "Diet, purchases and waste", ["food", "shopping", "waste"]]
];
const iso = t => new Date(t).toISOString().slice(0, 10);
function coveredDays(L) {
  const r = L.map(l => [Date.parse(l.period_start), Date.parse(l.period_end)]).sort((a, b) => a[0] - b[0]);
  let days = 0, end = -Infinity;
  for (const [s, e] of r) {
    if (e <= end) continue;
    days += (e - Math.max(s, end + 864e5)) / 864e5 + 1;
    end = e;
  }
  return days;
}
// Yearly estimate per category: logged data scaled to a year where there is enough of it, otherwise the questionnaire.
function estimate(logs, base) {
  const out = {};
  for (const [cat, c] of Object.entries(LOGS)) {
    const L = logs.filter(l => l.category === cat), kg = L.reduce((s, l) => s + +l.kg_co2e, 0);
    // Dated events are spread from the first entry to today (at least 30 days); periods count the calendar days
    // they cover, so overlapping entries (e.g. veg and non-veg meals for the same month) aren't counted twice.
    const days = !L.length ? 0 : c.event
      ? Math.max(30, (Date.now() - Math.min(...L.map(l => Date.parse(l.period_start)))) / 864e5 + 1)
      : coveredDays(L);
    if (L.length && (c.event || days >= 7)) out[cat] = { kg: kg / Math.min(days, 365) * 365, src: `from ${L.length} logged ${L.length > 1 ? "entries" : "entry"}`, logs: L };
    else if (base[cat] != null) out[cat] = { kg: base[cat], src: L.length ? "questionnaire (log at least a week)" : "questionnaire estimate", logs: L };
    else out[cat] = { kg: 0, src: "no data yet", logs: L };
  }
  return out;
}
// A personalised suggestion for one category, with a rough yearly saving where the data allows it.
function advice(cat, e) {
  const sumBy = test => e.logs.filter(test).reduce((s, l) => s + +l.kg_co2e, 0), all = sumBy(() => true) || 1, kg = n => Math.round(n);
  switch (cat) {
    case "transport": {
      const priv = sumBy(l => ["car", "cab", "two", "auto"].includes(l.details.vehicle)) / all;
      return priv > 0.3 && e.logs.length
        ? `About ${Math.round(priv * 100)}% of your logged travel emissions come from private vehicles. Moving half of those trips to bus or metro would save roughly ${kg(e.kg * priv * 0.5 * 0.8)} kg a year.`
        : "Walk, cycle or take the bus or metro for some trips, and share rides when you can't.";
    }
    case "electricity": return `Cutting electricity use by 15% (fans and lights off when you leave, AC at 24–26 °C, LED bulbs) would save about ${kg(e.kg * 0.15)} kg a year.`;
    case "cooking": return `Pressure cookers, lids on pans and the right burner size cut cooking fuel by 20–30%, about ${kg(e.kg * 0.25)} kg a year for you.`;
    case "food": {
      const meat = sumBy(l => l.details.meal === "mutton") / all, chicken = sumBy(l => l.details.meal === "chicken") / all;
      if (meat > 0.1) return `Mutton and beef make up ${Math.round(meat * 100)}% of your logged food emissions. Swapping half of those meals for vegetarian ones would save about ${kg(e.kg * meat * 0.5 * 0.8)} kg a year.`;
      if (chicken > 0.2) return `Swapping half your chicken or fish meals for vegetarian ones would save about ${kg(e.kg * chicken * 0.5 * 0.5)} kg a year.`;
      return "Take only what you'll eat, try more plant-based meals, and cook or eat at the mess instead of ordering in.";
    }
    case "shopping": return "Buy fewer, longer-lasting things: one clothing item fewer each month saves about 180 kg a year. Repair before replacing, and recycle old electronics.";
    case "waste": {
      const mixed = sumBy(l => ["mixed", "burned"].includes(l.details.method)) / all;
      return mixed > 0.3 && e.logs.length
        ? `Separating wet and dry waste instead of using a mixed bin (or burning it) cuts its emissions by about 75%, saving roughly ${kg(e.kg * mixed * 0.75)} kg a year.`
        : "Keep segregating waste, compost kitchen scraps if you can, and carry a reusable bottle and bag.";
    }
  }
}

    <span><b>${Math.round(l.kg_co2e)} kg</b> <button class="s o" onclick="deleteLog('${l.id}')" aria-label="Delete entry">✕</button></span></div>`).join("")

  `<p class="mute" style="font-size:.8rem">How this is calculated: each entry is multiplied by a typical Indian emission factor (for example ${GRID} kg CO₂ per kWh of grid electricity, 0.17 kg per km in a petrol car, 42 kg per LPG cylinder). Logged categories are scaled to a full year from the dates you logged; the rest use your questionnaire answers. It is an estimate, not a certified measurement.</p>

async function readBill(f) {
  const m = $("billmsg");
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) { m.className = "err"; m.textContent = "That file is over 10 MB."; return; }
  const ext = { "application/pdf": "pdf", "image/png": "png", "image/webp": "webp", "image/jpeg": "jpg" }[f.type];
  if (!ext) { m.className = "err"; m.textContent = "Please upload a JPG, PNG, WebP or PDF."; return; }
  m.className = "mute"; m.textContent = "Uploading…";
  const path = `${me.id}/${crypto.randomUUID()}.${ext}`;
  const up = await db.storage.from("bills").upload(path, f, { contentType: f.type });
  if (up.error) { m.className = "err"; m.textContent = up.error.message; return; }
  billPath = path;
  m.textContent = "Reading your bill… (this can take a few seconds)";
  try {
    const v = await api("/api/bills/extract", { path });
    if (v.kwh != null) $("f_kwh").value = v.kwh;
    if (v.period_start) $("f_start").value = v.period_start;
    if (v.period_end) $("f_end").value = v.period_end;
    m.textContent = v.kwh != null
      ? `We filled in the values from your bill${v.amount_inr != null ? ` (amount ₹${v.amount_inr})` : ""}. Please check them and correct anything that's wrong before saving.`
      : "We couldn't find the units on this bill. Please type them in.";
  } catch (e) { m.className = "mute"; m.textContent = e.message + " Your bill is still attached."; }
}
async function saveLog(cat) {
  const c = LOGS[cat], d = {};
  for (const [id, , opts] of c.fields) d[id] = Array.isArray(opts) ? $("f_" + id).value : +$("f_" + id).value;
  const nums = c.fields.filter(f => !Array.isArray(f[2])).map(f => d[f[0]]);
  if (nums.some(n => !Number.isFinite(n) || n < 0) || !(nums[0] > 0)) return say("Please enter the amounts (numbers above zero).", 1);
  const start = $("f_start").value, end = c.event ? start : $("f_end").value;
  if (!start || !end || end < start) return say("Please check the dates.", 1);
  if (end > iso(Date.now())) return say("Dates can't be in the future.", 1);
  const { error } = await db.from("footprint_logs").insert({ user_id: me.id, category: cat, period_start: start, period_end: end,
    details: d, kg_co2e: Math.round(logKg(cat, d) * 10) / 10, bill_path: billPath });
  if (error) return say(error.message, 1);
  show("fp");
}
async function deleteLog(id) {
  if (!confirm("Delete this entry?")) return;
  const { error } = await db.from("footprint_logs").delete().eq("id", id);
  error ? alert(error.message) : fp();
}

  <div class="row"><b>${esc(a.name)}</b><span class="pill">+${a.xp_value}</span></div>
  <span class="mute">${esc(st.full_name || "Student")} · ${esc(st.usn || "no USN")}${st.department ? " · " + esc(st.department) : ""}${st.year ? " · Year " + st.year : ""}</span><br>
  <span class="mute">Submitted ${ago(s.submitted_at)}${s.history ? ` · history: ${s.history.approved} approved, ${s.history.rejected} rejected` : ""}</span>
  ${s.duplicate ? `<div class="warn">⚠ This photo was also used in ${s.duplicate.count} other submission${s.duplicate.count > 1 ? "s" : ""}${s.duplicate.otherStudent ? ", including another student's" : ""}.</div>` : ""}
  ${pending ? `<div class="row" style="margin-top:.6rem"><label style="display:flex;gap:.4rem;align-items:center"><input type="checkbox" style="width:auto;margin:0" onchange="toggleSel('${s.id}',this.checked)"${adminSel.has(s.id) ? " checked" : ""}> Select</label>
    <span><button class="s" onclick="reviewMany(true,['${s.id}'])">Approve</button> <button class="s o" onclick="reviewMany(false,['${s.id}'])">Reject</button></span></div>`
    : `<p class="mute">${s.verification_status === "verified" ? "✅ Approved" : "❌ Rejected"} ${s.verified_at ? ago(s.verified_at) : ""}${s.reviewer ? " by " + esc(s.reviewer.full_name) : ""}${s.rejection_reason ? `<br>Reason: ${esc(s.rejection_reason)}` : ""}</p>`}
  </div>`;
}
function zoom(src) { $("lb").querySelector("img").src = src; $("lb").hidden = false; }
function toggleSel(id, on) { on ? adminSel.add(id) : adminSel.delete(id); renderQueue(); }
function selectAll(on) { const f = $("af").value; adminSel = new Set(on ? adminData.filter(s => !f || s.activities.name === f).map(s => s.id) : []); renderQueue(); }
function askReason() {
  return new Promise(done => {
    const d = $("rj"); $("rjs").value = ""; $("rjt").value = "";
    d.onclose = () => done(d.returnValue === "ok" ? ($("rjt").value.trim() || $("rjs").value || "Rejected by admin") : null);
    d.returnValue = ""; d.showModal();
  });
}
async function reviewMany(approve, ids = [...adminSel]) {
  if (!ids.length) return;
  let reason = null;
  if (!approve) { reason = await askReason(); if (reason == null) return; }
  else if (ids.length > 1 && !confirm(`Approve ${ids.length} submissions and award their XP?`)) return;
  try {
    const r = await api("/api/admin/submissions/review", { ids, approve, reason });
    const failed = new Set(r.failed.map(f => f.id));
    adminData = adminData.filter(s => !ids.includes(s.id) || failed.has(s.id));
    ids.forEach(id => adminSel.delete(id));
    renderQueue(); loadStats();
    if (r.failed.length) say([...new Set(r.failed.map(f => f.error))].join(". "), 1);
    else say(`${r.done} submission${r.done > 1 ? "s" : ""} ${approve ? "approved, XP awarded" : "rejected"}.`);
  } catch (e) { say(e.message, 1); }
}
async function issueAll() {
  if (!confirm("Issue year-end certificates now?")) return;
  try { const r = await api("/api/admin/certificates/issue"); $("cmsg").textContent = `${r.issued} certificate(s) issued.`; }
  catch (e) { $("cmsg").className = "err"; $("cmsg").textContent = e.message; }
}
init();
</script></body></html>
