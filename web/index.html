<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenXP</title>
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#0c2e27">
<meta name="description" content="GreenXP: earn XP for real green actions, track your carbon footprint, climb your campus leaderboard and earn a verifiable annual certificate.">
<meta property="og:title" content="GreenXP: Go green. Level up."><meta property="og:description" content="Every green action counts. Now it scores too."><meta property="og:image" content="https://greenxp.in/logo-full.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#effaf5;--card:#fff;--ink:#0e3b36;--mute:#4f7a73;--line:#cfe9df;--pri:#19b37a;--prid:#0f8a5c;--xp:#ffc83d}
@media(prefers-color-scheme:dark){:root{--bg:#0a1f1c;--card:#12322d;--ink:#e6f6f1;--mute:#8fbdb3;--line:#1f4a43}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
.app{max-width:520px;margin:auto;padding:1rem 1rem 5.5rem}h1,h2,h3{margin:.2rem 0 .5rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.7rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem}.mute{color:var(--mute);font-size:.9rem}.slogan{color:var(--prid);font-weight:700;font-style:italic;margin:.1rem 0 .8rem}
button{font:700 1rem system-ui;border:0;border-radius:12px;padding:.65rem 1rem;background:var(--pri);color:#fff;cursor:pointer;border-bottom:3px solid var(--prid)}
button.o{background:transparent;color:var(--prid);border:2px solid var(--line)}button.s{padding:.35rem .8rem;font-size:.9rem}
input,select{width:100%;max-width:100%;min-width:0;font:inherit;padding:.65rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:.2rem 0 .6rem}
.pill{background:var(--xp);color:#4a3500;border-radius:99px;padding:.1rem .6rem;font-weight:700;font-size:.85rem}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:safe center;overflow-x:auto;gap:.3rem;background:var(--card);border-top:2px solid var(--line);padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;color:var(--mute);border:0;padding:.4rem .7rem;flex-shrink:0;white-space:nowrap}.tabs button.on{color:var(--prid);background:var(--line)}
.app.wide{max-width:960px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-bottom:.7rem}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:.8rem}.stat b{display:block;font-size:1.7rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.7rem}.grid .card{margin:0}
.proof{width:100%;height:190px;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block;margin-bottom:.5rem;background:var(--line)}
.noproof{height:60px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:10px;margin-bottom:.5rem}
.warn{background:#fff3cd;color:#664d03;border-radius:10px;padding:.4rem .6rem;font-size:.9rem;margin:.4rem 0}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:9;cursor:zoom-out}.lb img{max-width:95vw;max-height:90vh;border-radius:10px}
dialog{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;width:min(420px,92vw)}dialog::backdrop{background:rgba(0,0,0,.5)}
textarea{width:100%;font:inherit;padding:.65rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:.2rem 0 .6rem}
.tbl{overflow-x:auto;border:2px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.55rem .6rem;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--mute);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
td:nth-child(2){white-space:normal;min-width:200px}
tbody tr:nth-child(even):not(.editrow){background:color-mix(in srgb,var(--line) 35%,transparent)}
tbody tr:hover:not(.editrow){background:var(--line)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td.acts button{margin:.1rem 0}
button.danger{color:#b3261e;border-color:#b3261e}
/* Institutions table: '#' and name frozen on the left (like Excel's Freeze Panes), visible scrollbars above and below */
.tbl.freeze{max-height:70vh;overflow:auto}
.tbl.freeze table{width:max-content;min-width:100%}
.tbl.freeze td.fz2{white-space:normal;min-width:240px;max-width:320px}
.fz1,.fz2{position:sticky;z-index:1;background:var(--card)}
.fz1{left:0;width:2.6rem;min-width:2.6rem}
.fz2{left:2.6rem;box-shadow:3px 0 0 var(--line)}
thead .fz1,thead .fz2{z-index:3}thead th{z-index:2}
tbody tr:nth-child(even):not(.editrow) .fz1,tbody tr:nth-child(even):not(.editrow) .fz2{background:color-mix(in srgb,var(--line) 35%,var(--card))}
tbody tr:hover:not(.editrow) .fz1,tbody tr:hover:not(.editrow) .fz2{background:var(--line)}
.topscroll{overflow-x:auto;overflow-y:hidden;height:16px;margin-bottom:.3rem}.topscroll div{height:1px}
.tbl,.topscroll{scrollbar-color:var(--pri) var(--line);scrollbar-width:auto}
.tbl::-webkit-scrollbar,.topscroll::-webkit-scrollbar{height:12px;width:12px}
.tbl::-webkit-scrollbar-thumb,.topscroll::-webkit-scrollbar-thumb{background:var(--pri);border-radius:8px;border:2px solid var(--line)}
.tbl::-webkit-scrollbar-track,.topscroll::-webkit-scrollbar-track{background:var(--line);border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.45rem .9rem;border:2px solid var(--line);border-radius:99px;cursor:pointer;font-weight:700}
.chip input{width:auto;margin:0}.chip:has(input:checked){border-color:var(--pri);background:color-mix(in srgb,var(--pri) 18%,transparent)}
.certwrap{overflow:auto;margin:.6rem 0}
.cert{position:relative;width:297mm;height:210mm;background:#fff;color:#12312a;overflow:hidden;font-family:Georgia,"Times New Roman",serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.certbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.certframe{position:absolute;inset:7mm;border:1.2mm double #19b37a}
.certin{position:absolute;inset:16mm 22mm 14mm;display:flex;flex-direction:column;align-items:center;text-align:center}
.certin h1{font-size:25pt;margin:0 0 1mm;color:#12312a}.certin .who{font-size:23pt;font-weight:700;margin:1.5mm 0}
.certin p{margin:.8mm 0;font-size:11.5pt;color:#12312a}.certdist{display:inline-block;margin:0 0 1.5mm;padding:1mm 5mm;border-radius:2mm;background:linear-gradient(90deg,#c8861f,#f2b457,#c8861f);color:#3a2600;font:700 10pt Georgia,serif;letter-spacing:.4mm;text-transform:uppercase}
.distinction{display:inline-block;margin:.2rem 0 .3rem;padding:.15rem .6rem;border-radius:99px;background:linear-gradient(90deg,#c8861f,#f2b457);color:#3a2600;font-size:.75rem;font-weight:800;letter-spacing:.03em}
.dist-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-top:1px dashed var(--line);padding-top:.4rem;margin-top:.1rem}
.certstars{font-size:20pt;color:#e9a23b;letter-spacing:2mm;line-height:1;margin:0 0 1.5mm}
.stars{color:#e9a23b;letter-spacing:.12em;font-size:1.15rem;white-space:nowrap}.stars-scale{display:grid;gap:.35rem}.stars-scale div{display:flex;justify-content:space-between;gap:1rem}
.certcard{border:2px solid color-mix(in srgb,#e9a23b 55%,var(--line));background:linear-gradient(160deg,color-mix(in srgb,#e9a23b 8%,var(--card)),var(--card) 60%)}
.certacts{width:100%;margin:2.5mm 0;columns:2;column-gap:10mm;font-size:9pt;text-align:left;flex:1;min-height:0;overflow:hidden}
.certacts.many{columns:3;font-size:7.5pt}.certacts div{display:flex;justify-content:space-between;gap:3mm;break-inside:avoid;border-bottom:.2mm solid #cfe3da;padding:.5mm 0}
.certfoot{width:100%;display:flex;justify-content:space-between;align-items:flex-end;font-size:9.5pt;text-align:left}
.certsign{text-align:center;min-width:60mm}.certsign img{max-height:16mm;max-width:60mm;display:block;margin:0 auto}
.certsign b{display:block;border-top:.3mm solid #12312a;padding-top:1mm}
@media print{@page{size:A4 landscape;margin:0}body *{visibility:hidden}#certdoc,#certdoc *{visibility:visible}#certdoc{position:fixed;left:0;top:0;zoom:1!important}}
.acticon{font-size:1.9rem;line-height:1;flex-shrink:0}
.actgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(270px,100%),1fr));gap:.7rem;align-items:start}.actgrid .card{margin:0}
.actdet{margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--line)}.actdet p{margin:.2rem 0 .6rem}.chev{font-size:1.2rem}
.err{color:#b3261e;font-weight:700}.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
/* ---------- Page layout: phone first, laptop from 900px ---------- */
.app>h2:first-child,.app>h1:first-child{font:800 clamp(1.7rem,4vw,2.5rem)/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin-top:.4rem}
.app h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin-top:1.2rem}
.card{box-shadow:0 1px 0 var(--line);transition:box-shadow .2s,transform .2s}
.dash{display:grid;grid-template-columns:1fr;gap:.7rem;margin-bottom:.7rem}.dash>.card,.dash>p{margin:0}
.board .card{display:flex;align-items:center}.board .medal{font-size:1.5rem;width:2.2rem;text-align:center}
.goal{display:grid;grid-template-columns:1fr;gap:.8rem}.goal div{border-left:3px solid #e9a23b;padding:.1rem 0 .1rem .7rem}.goal b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.board .card.top{border-color:var(--xp);background:color-mix(in srgb,var(--xp) 12%,var(--card))}
@media(max-width:899px){
  .app{padding:.8rem .9rem 6rem}
  .tabs{justify-content:flex-start;scrollbar-width:none;box-shadow:0 -6px 20px #0000000f}.tabs::-webkit-scrollbar{display:none}
  .tabs button{font-size:.82rem;padding:.45rem .6rem;border-radius:10px}
  button{min-height:44px}button.s{min-height:36px}
  .row{flex-wrap:wrap}
}
@media(min-width:900px){
  .app{max-width:680px;padding:2.2rem 2rem 3rem}
  body:has(#tabs:not([hidden])) .app{max-width:1180px;padding:6rem 2.5rem 3rem}
  .tabs{top:0;bottom:auto;z-index:5;border-top:0;border-bottom:2px solid var(--line);justify-content:flex-start;align-items:center;gap:.3rem;
    padding:.7rem max(2.5rem,calc(50vw - 565px));background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .tabs:before{content:"🌱 GreenXP";font:800 1.45rem "Bricolage Grotesque",system-ui,sans-serif;color:var(--ink);margin-right:auto;letter-spacing:-.02em}
  .tabs button{border-radius:99px;padding:.5rem 1rem;font-size:.95rem}.tabs button:hover{color:var(--prid);background:color-mix(in srgb,var(--line) 60%,transparent)}
  .tabs button:last-child{margin-left:.8rem;border:2px solid var(--line)}
  .dash{grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-bottom:1rem}.dash>.span{grid-column:1/-1}
  .dash.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .card{padding:1.2rem 1.3rem}
  .card:hover{box-shadow:0 10px 30px #0634271a}
  .actgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
  .form{max-width:760px}
  .goal{grid-template-columns:repeat(3,1fr)}.board .card{padding:.8rem 1.3rem;margin-bottom:.6rem}
}
/* ---------- Navigation bar: forest green, matches the landing page ---------- */
.tabs{background:linear-gradient(180deg,#0f3a31,#0a2722)!important;border-color:#ffffff14!important;gap:.2rem}
.tabs button{position:relative;background:none!important;color:#a7cfc3;border:0;border-radius:10px;font:600 .95rem "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:.01em;transition:color .2s}
.tabs button:hover{color:#fff!important}
.tabs button.on{color:#fff}
.tabs button.on:after{content:"";position:absolute;left:22%;right:22%;height:3px;border-radius:3px;background:#e9a23b;box-shadow:0 0 12px #e9a23b99}
.tabs button.out{color:#e9a23b;border:1.5px solid #e9a23b66!important;border-radius:99px}
.tabs button.out:hover{background:#e9a23b!important;color:#071d18!important}
@media(max-width:899px){.tabs button.on:after{top:0}.tabs button.out{margin-left:.3rem;padding:.3rem .8rem;align-self:center}}
@media(min-width:900px){
  .tabs{-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:0 8px 30px #0634272e}
  .tabs:before{content:"GreenXP"!important;font:800 1.55rem "Bricolage Grotesque",system-ui,sans-serif;background:linear-gradient(90deg,#eafaf3 69.5%,#5fd6a8 70%);-webkit-background-clip:text;background-clip:text;color:transparent!important}
  .tabs button{padding:.55rem 1rem}
  .tabs button.on:after{bottom:-2px}
  .tabs button.out{margin-left:1rem;padding:.45rem 1.1rem}
}
/* ---------- Logo ---------- */
.tabs:before{display:none!important}
.brand{display:flex;cursor:pointer;margin-right:auto;align-items:center;flex-shrink:0}.brand img{height:38px;width:auto;display:block}.brand .bs{display:none}
@media(max-width:899px){.brand{margin-right:.2rem;padding:0 .3rem}.brand .bl{display:none}.brand .bs{display:block;height:30px}}
@media(min-width:900px){.brand{display:flex}}
.brandh{display:flex;align-items:center;gap:.6rem}.brandh img{height:1.6em;width:auto}
.l-logo{display:block;width:clamp(120px,min(15vw,19vh),210px);height:auto;margin:0 0 10px;filter:drop-shadow(0 12px 24px #06342733)}
.certlogo{height:17mm;width:auto;margin:0 0 1.5mm}
/* ---------- Photo editor ---------- */
.phed{margin:.2rem 0 .4rem}
.phcrop{position:relative;width:min(260px,100%);aspect-ratio:1;overflow:hidden;border-radius:16px;background:#0c2e27;touch-action:none;cursor:grab;user-select:none}
.phcrop:active{cursor:grabbing}
.phcrop img{position:absolute;left:50%;top:50%;max-width:none;pointer-events:none}
.phcrop:after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px #0009;outline:2px solid #ffffffcc;outline-offset:-2px;pointer-events:none}
.phctl{display:flex;align-items:center;gap:.5rem;width:min(360px,100%);margin:.6rem 0 .2rem}.phctl input{margin:0;flex:1;accent-color:#e9a23b;padding:0}
.phctl button{min-width:44px;font-size:1.25rem;line-height:1;padding:.3rem .6rem}.phctl button:last-child{font-size:.9rem}
#sec_main{scroll-margin-top:12px}@media(min-width:900px){#sec_main{scroll-margin-top:84px}}
.axin{width:80px;margin:0;padding:.4rem .5rem;text-align:right}.axin.changed{border-color:#e9a23b;background:color-mix(in srgb,#e9a23b 14%,var(--card))}
/* ---------- Streak card ---------- */
.streak.on{border-color:color-mix(in srgb,#e9a23b 55%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,#e9a23b 12%,var(--card)),var(--card) 65%)}
.sk-num{display:flex;align-items:baseline;gap:.4rem;margin:.2rem 0 .6rem}.sk-num b{font:800 2.6rem/1 "Bricolage Grotesque",system-ui,sans-serif}.sk-num span:last-child{color:var(--mute);font-weight:700}
.sk-flame{font-size:1.9rem;filter:grayscale(1) opacity(.45)}.streak.on .sk-flame{filter:none}
.sk-week{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;text-align:center}
.sk-week i{display:block;height:10px;border-radius:99px;background:var(--line);margin-bottom:.25rem}
.sk-week .done i{background:linear-gradient(90deg,#e9a23b,#f2b457);box-shadow:0 0 10px #e9a23b66}
.sk-week span{font-size:.7rem;color:var(--mute);font-weight:700}.sk-week .today span{color:var(--ink)}
/* ---------- Pay to continue ---------- */
.paycta{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-color:color-mix(in srgb,#e9a23b 60%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,#e9a23b 14%,var(--card)),var(--card) 70%)}
.paycta p{margin:.2rem 0 0}.paycta button,.locked button{background:#e9a23b;color:#071d18;border-bottom-color:#b97a1f}
.locked{text-align:center}.locked .lk{font-size:2.4rem}
/* ---------- Leaderboards ---------- */
.lbtabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin:.2rem 0 .8rem}
.lbtabs button{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:.7rem .9rem;min-width:0}
.lbtabs button span{font:600 .78rem system-ui;color:var(--mute);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbtabs button em{font:800 1.35rem/1.1 "Bricolage Grotesque",system-ui,sans-serif;font-style:normal;color:#e9a23b;margin-top:.25rem}.lbtabs button em small{font:600 .75rem system-ui;color:var(--mute)}
.lbgap{text-align:center;color:var(--mute);font-size:1.4rem;line-height:1;margin:.1rem 0 .5rem}
.lbtabs button b{font:800 1.05rem "Bricolage Grotesque",system-ui,sans-serif}
.lbtabs button.on{border-color:#e9a23b;background:linear-gradient(150deg,color-mix(in srgb,#e9a23b 18%,var(--card)),var(--card) 70%);box-shadow:0 6px 18px #e9a23b33}
.board .card.me{outline:2px solid #e9a23b;outline-offset:-2px}
/* ---------- About ---------- */
.ab-hero{position:relative;text-align:center;padding:1.6rem 1rem 1.2rem;margin-bottom:1rem;border-radius:22px;background:radial-gradient(70% 90% at 50% 0%,color-mix(in srgb,#4cc9a0 25%,transparent),transparent 70%)}
.ab-logo{display:block;margin:0 auto;width:clamp(110px,14vw,160px);height:auto;filter:drop-shadow(0 10px 22px #06342733)}
.ab-k{display:inline-block;letter-spacing:.18em;text-transform:uppercase;font-size:.72rem;font-weight:800;color:var(--prid);margin:.4rem 0 .3rem}
.ab-hero h2{font:800 clamp(1.8rem,4.4vw,3rem)/1.08 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;margin:.2rem 0 .7rem}.ab-hero h2 em{font-style:normal;color:#e9a23b}
.ab-hero p{max-width:60ch;margin:0 auto;color:var(--mute);font-size:1.05rem}
.ab-sec{display:grid;grid-template-columns:auto 1fr;gap:1rem 1.2rem;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:1.3rem 1.4rem;margin-bottom:1rem}
.ab-n{font:800 2.4rem/1 "Bricolage Grotesque",system-ui,sans-serif;color:#e9a23b;min-width:3.2rem}
.ab-sec h3{font:800 clamp(1.3rem,2.4vw,1.75rem)/1.15 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 .6rem}
.ab-sec p{line-height:1.6;margin:.4rem 0 .8rem}
.ab-pts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem;margin:.6rem 0 .8rem}
.ab-pts div{border-left:3px solid #e9a23b;padding:.2rem 0 .2rem .8rem}.ab-pts b{display:block;margin-bottom:.15rem}.ab-pts span{color:var(--mute);font-size:.93rem;line-height:1.5}
.ab-quote{font:600 1.08rem/1.5 "Bricolage Grotesque",system-ui,sans-serif;color:var(--prid);border-left:4px solid var(--pri);padding:.2rem 0 .2rem .9rem}
.ab-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:.8rem}
.ab-out>div{border:2px solid var(--line);border-radius:16px;padding:.9rem 1rem;background:color-mix(in srgb,var(--line) 25%,transparent)}
.ab-out b{font:800 1.05rem "Bricolage Grotesque",system-ui,sans-serif;color:#e9a23b}.ab-out ul{margin:.4rem 0 0;padding-left:1.1rem;color:var(--mute);line-height:1.55;font-size:.93rem}
.ab-cta{text-align:center;padding:1.6rem 1rem;border-radius:20px;background:linear-gradient(135deg,#0f3a31,#0a2722);color:#eafaf3}
.ab-cta h3{font:800 clamp(1.3rem,3vw,1.9rem)/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 .4rem}.ab-cta p{color:#a7cfc3;margin:0 0 1rem}
.ab-cta button{background:#e9a23b;color:#071d18;border-bottom-color:#b97a1f;padding:.8rem 1.4rem}
@media(max-width:600px){.ab-sec{grid-template-columns:1fr;padding:1.1rem}.ab-n{font-size:1.9rem}}
.gpsnote{border-color:color-mix(in srgb,#3b82d6 55%,var(--line));background:linear-gradient(150deg,color-mix(in srgb,#3b82d6 12%,var(--card)),var(--card) 70%)}
.gpsnote p{margin:.3rem 0 0}.gpsnote a{color:var(--prid);font-weight:700}
.gpstip{font-size:.88rem;border-left:3px solid #3b82d6;padding:.2rem 0 .2rem .6rem;color:var(--mute)}
/* ---------- FAQ ---------- */

<dialog id="lo" aria-labelledby="lo_t"><form method="dialog"><h3 id="lo_t">Log out?</h3><p class="mute">Are you sure you want to log out of GreenXP?</p>

<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const LV = [[0,"Eco Starter","🌱"],[100,"Green Rookie","🍃"],[300,"Green Warrior","🌿"],[600,"Eco Champion","🌳"],[1000,"Planet Hero","🌎"],[2000,"Eco Legend","🏆"]];
let me = null, tab = "home", acts = {};
// member: this year's membership is paid or waived. Without it, Home, Earn XP (browsing), Footprint, FAQ and Contact
// stay open with a "Pay to continue" button; activities, footprint entries, the leaderboard and certificates need it.
let member = true, payYear = null;
// ---- Sign-in with Amazon Cognito: a direct call to its public API, no SDK needed ----
async function idp(action, body) {
  const r = await fetch(`https://cognito-idp.${GXP.COGNITO_REGION}.amazonaws.com/`, { method: "POST",
    headers: { "Content-Type": "application/x-amz-json-1.1", "X-Amz-Target": "AWSCognitoIdentityProviderService." + action },
    body: JSON.stringify({ ClientId: GXP.COGNITO_CLIENT_ID, ...body }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.message || "Something went wrong. Please try again."), { code: String(j.__type || "").split("#").pop() });
  return j;
}
// The session (ID token for the API, refresh token to renew it) is kept in this browser, as Supabase did.
let session = (() => { try { return JSON.parse(localStorage.getItem("gxp_session")); } catch { return null; } })();
function keepSession(a, refresh) {
  session = { id: a.IdToken, refresh: a.RefreshToken || refresh, exp: Date.now() + (a.ExpiresIn - 60) * 1000 };
  try { localStorage.setItem("gxp_session", JSON.stringify(session)); } catch {}
}
function dropSession() { session = null; try { localStorage.removeItem("gxp_session"); } catch {} }
async function signIn(email, password) {
  keepSession((await idp("InitiateAuth", { AuthFlow: "USER_PASSWORD_AUTH", AuthParameters: { USERNAME: email.trim().toLowerCase(), PASSWORD: password } })).AuthenticationResult);
}
async function idToken() {
  if (!session) return null;
  if (Date.now() < session.exp) return session.id;
  try { keepSession((await idp("InitiateAuth", { AuthFlow: "REFRESH_TOKEN_AUTH", AuthParameters: { REFRESH_TOKEN: session.refresh } })).AuthenticationResult, session.refresh); }
  catch { dropSession(); return null; }
  return session.id;
}
async function api(path, body, method = "POST") {
  const token = await idToken();
  if (!token) throw new Error("Your session has expired. Please log in again.");
  const r = await fetch(GXP.API_URL + path, { method, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Request failed"), { status: r.status });
  return j;
}
// Pages anyone can see (sign-up list, counters, certificate check) need no sign-in.
const pub = path => fetch(GXP.API_URL + path).then(r => r.ok ? r.json() : null).catch(() => null);
// Photos and bills go straight to storage with a short-lived upload form from the API.
async function upload(bucket, file) {
  // Some browsers don't know HEIC and leave the type empty.
  const byExt = { heic: "image/heic", heif: "image/heif", pdf: "application/pdf" }[file.name.split(".").pop().toLowerCase()];
  const u = await api("/api/uploads", { bucket, contentType: file.type || byExt || "image/jpeg" });
  const fd = new FormData();
  for (const [k, v] of Object.entries(u.fields)) fd.append(k, v);
  fd.append("file", file); // must come last
  const r = await fetch(u.url, { method: "POST", body: fd });
  if (!r.ok) throw new Error("Upload failed. Please try again with a file under 10 MB.");
  return u.path;
}
const say = (m, bad) => { const e = $("msg"); if (e) { e.textContent = m; e.className = bad ? "err" : "mute"; } };

async function init() {
  const shared = new URLSearchParams(location.search).get("verify");
  if (shared) return verifyScreen(shared);
  if (!session) return authScreen();
  let r;
  try { r = await api("/api/me", null, "GET"); }
  catch (e) {
    if (e.status === 403) {
      $("tabs").hidden = true;
      $("app").innerHTML = `<div class="card"><p>Your account is still being set up.</p><button onclick="init()">Try again</button> <button class="o" onclick="logout()">Log out</button></div>`;
      return;
    }
    if (e.status === 401 || !session) { dropSession(); return authScreen(); }
    $("tabs").hidden = true;
    $("app").innerHTML = `<div class="card"><p class="err">${esc(e.message)}</p><button onclick="init()">Try again</button></div>`;
    return;
  }
  me = r.profile;
  // Admins manage the college and go straight to their dashboard; the onboarding steps below are for students.
  if (["admin", "super_admin"].includes(me.role)) { $("tabs").hidden = false; return show("admin"); }
  if (!me.college_id) return institutionScreen();
  if (!me.usn || !me.department) return profileScreen();
  if (me.approval_status === "rejected") return approvalScreen();
  me.survey = r.survey;
  if (!me.survey) return surveyScreen();
  member = !!r.member; payYear = r.year;
  $("tabs").hidden = false; show("home");
}
async function authScreen() {
  $("tabs").hidden = true;
  insts = await pub("/api/public/colleges") || [];
  $("app").innerHTML = `<section class="landing">${heroArt()}
  <div class="l-in"><div>
    <img class="l-logo" src="logo-mark.png" alt="GreenXP logo">
    <span class="l-eyebrow">Sustainability, gamified · for students &amp; campuses</span>
    <h1 class="l-word">Green<span>XP</span></h1>
    <p class="l-title">Go green. <em>Level up.</em></p>
    <p class="l-theme">Every green action counts. Now it scores too.</p>
    <ul class="l-steps"><li><b>1</b>Act green</li><li><b>2</b>Upload proof</li><li><b>3</b>Earn XP</li><li><b>4</b>Get certified</li></ul>
    <div class="l-cta"><button class="btn btn-p" onclick="heroGo('signup')">Start your green streak</button><button class="btn btn-g" onclick="heroGo('login')">I already have an account</button></div>
  </div>
  <div class="l-side">
  <div class="card l-card" id="authcard"><h3><img src="favicon.png" alt="" style="height:1.4em;vertical-align:-.35em;margin-right:.35rem">Join the green league</h3><p class="mute" style="margin-top:0">Earn your Community Activities Points and Proof of Certificate.</p>
  <div class="row" style="justify-content:flex-start;margin-bottom:.8rem"><button id="m_login" onclick="authMode('login')">Log in</button><button id="m_signup" class="o" onclick="authMode('signup')">Sign up</button></div>
  <div id="su" hidden>
    <p class="mute">Find your institution by state, city and pincode.</p>
    <label for="f_st">State</label><select id="f_st" onchange="pickInst(1)"></select>
    <div class="row"><span style="flex:1"><label for="f_ci">City</label><select id="f_ci" onchange="pickInst(2)"></select></span>
      <span style="flex:1"><label for="f_pin">Pincode</label><select id="f_pin" onchange="pickInst(3)"></select></span></div>
    <label for="col">Institution</label><select id="col"></select>
    <label style="display:flex;gap:.4rem;align-items:center;margin-top:.5rem"><input type="checkbox" id="notlisted" style="width:auto;margin:0" onchange="$('ni').hidden=!this.checked;$('col').disabled=this.checked"> My institution isn't in the list</label>
    <div id="ni" hidden>${newInstFields()}</div>
    <label for="nm">Full name</label><input id="nm" autocomplete="name"></div>
  <label for="em">Email</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <p class="row" style="flex-wrap:wrap"><button id="go" onclick="login()">Log in</button>
    <a href="#" id="forgot" onclick="forgotPassword();return false" style="color:var(--prid);font-weight:700">Forgot password?</a></p><p id="msg"></p>
  <p><a href="#" onclick="about();return false" style="color:var(--prid);font-weight:700">🌍 About</a> &nbsp;·&nbsp; <a href="#" onclick="faq();return false" style="color:var(--prid);font-weight:700">❓ Read the FAQ</a> &nbsp;·&nbsp; <a href="#" onclick="help('authScreen');return false" style="color:var(--prid);font-weight:700">✉️ Contact us</a></p></div></div></div>
  <div class="l-stats" id="counters"></div>
  <div class="l-marq" aria-hidden="true"><div>${[0, 1].map(() => ["Talk is cheap. Proof earns XP.", "Small habits. Big planet.", "Save the planet, one XP at a time.", "Your rank says what you did for the planet.", "Little green steps add up to a big green change.", "A certificate that proves you made a difference."].map(t => `<span>${t}</span>`).join("")).join("")}</div></div>
  ${heroLand()}
  <div class="l-foot">GreenXP points are reward points, not carbon credits or money.</div></section>`;
  pickInst(0);
  showCounters();
}
// Landing art: contour lines and a sun behind the hero; hills, wind turbines and trees along the bottom.
function heroArt() {
  const lines = Array.from({ length: 18 }, (_, i) => `<path d="M-50 ${120 + i * 38} C 300 ${40 + i * 30}, 620 ${260 + i * 34}, 1250 ${60 + i * 36}"/>`).join("");
  const rings = Array.from({ length: 9 }, (_, i) => `<ellipse cx="1040" cy="620" rx="${50 + i * 36}" ry="${32 + i * 24}"/>`).join("");
  return `<svg class="l-topo" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">${lines}${rings}</svg><div class="l-sun" aria-hidden="true"></div>`;
}
function heroLand() {
  const tree = (x, h, pine) => pine
    ? `<g class="l-tree"><rect x="${x - 2}" y="${150 - h * .25}" width="4" height="${h * .25}" fill="#6b4f3a"/><path d="M${x} ${150 - h} L${x + h * .28} ${150 - h * .22} L${x - h * .28} ${150 - h * .22} Z" fill="#1f7a52"/></g>`
    : `<g class="l-tree"><rect x="${x - 2}" y="${150 - h * .4}" width="4" height="${h * .4}" fill="#6b4f3a"/><circle cx="${x}" cy="${150 - h * .62}" r="${h * .3}" fill="#2f9e62"/></g>`;
  const trees = [[60, 46], [92, 60, 1], [124, 38], [150, 52, 1], [1240, 50], [1274, 64, 1], [1310, 40], [1350, 56, 1], [1390, 44]].map(t => tree(...t)).join("");
  const turbine = (x, h) => `<g><rect x="${x - 1.5}" y="${150 - h}" width="3" height="${h}" fill="#cfe9df"/><g transform="translate(${x} ${150 - h})"><g class="l-blade" fill="#eafaf3">${[0, 120, 240].map(a => `<path transform="rotate(${a})" d="M0 0 L3 -2 L1 -${h * .45} L-1 -2 Z"/>`).join("")}</g></g></g>`;
  return `<svg class="l-land" viewBox="0 0 1440 150" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <path d="M0 90 C220 40 420 50 640 80 C860 110 1040 40 1240 45 C1340 48 1400 60 1440 66 L1440 150 L0 150 Z" fill="#4cc9a0" fill-opacity=".35"/>
    ${turbine(560, 84)}${turbine(640, 66)}${turbine(1120, 76)}
    <path d="M0 120 C260 92 520 98 760 116 C980 132 1200 100 1440 108 L1440 150 L0 150 Z" fill="#2f8f5b" fill-opacity=".55"/>${trees}</svg>`;
}
// Hero buttons: switch the form to log in / sign up and bring it into view.
function heroGo(m) {
  authMode(m);
  $("authcard").scrollIntoView({ behavior: "smooth", block: "center" });
  $(m === "signup" ? "f_st" : "em").focus({ preventScroll: true });
}
// Linked sign-up dropdowns: each choice narrows the next (state → city → pincode → institution).
let insts = [];
function pickInst(changed) {
  const keep = (id, level) => level <= changed ? $(id).value : ""; // keep the changed field and those above it
  const st = keep("f_st", 1), ci = keep("f_ci", 2), pin = keep("f_pin", 3);
  const inSt = insts.filter(c => !st || c.state === st), inCi = inSt.filter(c => !ci || c.city === ci), inPin = inCi.filter(c => !pin || c.pincode === pin);
  const uniq = (list, k) => [...new Set(list.map(c => c[k]).filter(Boolean))].sort();
  const fill = (id, all, values, cur, label = v => v) =>
    $(id).innerHTML = `<option value="">${all}</option>` + values.map(v => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(label(v))}</option>`).join("");

let PH = null; // the photo being framed: image, zoom, and offset of its centre from the frame's centre (in frame pixels)
function photoPick(f) {
  PH = null; $("x_ed").hidden = true;
  if (!f) return;
  if (!["image/jpeg", "image/png"].includes(f.type)) { $("x_photo").value = ""; return say("Please choose a JPG or PNG photo.", 1); }
  if (f.size > 10 * 1024 * 1024) { $("x_photo").value = ""; return say("Please choose a photo under 10 MB.", 1); }

  img.onload = () => { PH = { img, w: img.naturalWidth, h: img.naturalHeight, z: 1, x: 0, y: 0 }; $("x_ed").hidden = false; photoDraw(); photoBind(); };
  img.src = URL.createObjectURL(f);

const photoFrame = () => $("x_crop").clientWidth;
// Keep the photo covering the whole frame, then place it.
function photoDraw() {
  const F = photoFrame(), s = F / Math.min(PH.w, PH.h) * PH.z, dw = PH.w * s, dh = PH.h * s;
  PH.x = Math.max(-(dw - F) / 2, Math.min((dw - F) / 2, PH.x));
  PH.y = Math.max(-(dh - F) / 2, Math.min((dh - F) / 2, PH.y));
  Object.assign(PH.img.style, { width: dw + "px", height: dh + "px", transform: `translate(calc(-50% + ${PH.x}px), calc(-50% + ${PH.y}px))` });
  $("x_zoom").value = PH.z;
}
function photoSet(z, reset) {
  if (!PH) return;
  const nz = Math.max(1, Math.min(4, z)), k = nz / PH.z; // zoom around the frame's centre

// Drag with one pointer, pinch with two, zoom with the wheel.
function photoBind() {
  const box = $("x_crop"), pts = new Map();
  let pinch = 0;
  box.onpointerdown = e => { box.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); pinch = 0; };
  box.onpointermove = e => {
    if (!pts.has(e.pointerId) || !PH) return;
    const [px, py] = pts.get(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 1) { PH.x += e.clientX - px; PH.y += e.clientY - py; photoDraw(); return; }
    const [a, b] = [...pts.values()], dist = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch) photoSet(PH.z * dist / pinch);
    pinch = dist;
  };
  box.onpointerup = box.onpointercancel = e => { pts.delete(e.pointerId); pinch = 0; };
  box.onwheel = e => { e.preventDefault(); photoSet(PH.z * (1 - e.deltaY * .0015)); };
}

function photoFile() {
  const F = photoFrame(), s = F / Math.min(PH.w, PH.h) * PH.z, dw = PH.w * s, dh = PH.h * s, k = 600 / F;
  const c = document.createElement("canvas"); c.width = c.height = 600;

  g.imageSmoothingQuality = "high";
  g.drawImage(PH.img, ((F - dw) / 2 + PH.x) * k, ((F - dh) / 2 + PH.y) * k, dw * k, dh * k);

      if (!picked) return `Please choose: ${q.label}`;

      if (!(n >= (q.min ?? 0) && n <= (q.max ?? Infinity))) return `${q.label}: enter a number between ${q.min ?? 0} and ${q.max ?? "any"}.`;

// Emission factors (kg CO2e), typical Indian values. Vehicles are per vehicle-km; public transport and flights per passenger-km.
const EF = {

    cab:  { petrol: 0.17, diesel: 0.16, cng: 0.11, electric: 0.09 },
    two:  { petrol: 0.045, diesel: 0.045, cng: 0.04, electric: 0.02 },
    auto: { petrol: 0.08, diesel: 0.09, cng: 0.06, electric: 0.03 },
    bus: 0.03, metro: 0.02, train: 0.01, flight: 0.15 },
  cooking: { lpg: 42.3, png: 2.0, kerosene: 2.52, wood: 0.25, coal: 2.2 }, // per cylinder (14.2 kg), SCM, litre, kg, kg
  meal: { plant: 0.4, veg: 0.7, egg: 0.8, chicken: 1.4, mutton: 3.5 }, delivered: 0.3, // per meal; delivery adds packaging and transport
  item: { clothing: 15, footwear: 14, phone: 60, laptop: 250, electronics: 20, furniture: 60, books: 2, online: 1 },

    case "food": return d.meals * EF.meal[d.meal] + Math.min(d.delivered, d.meals) * EF.delivered;

    case "electricity": return `${d.kwh} kWh${d.people > 1 ? ` ÷ ${d.people} people` : ""}`;
    case "cooking": return `${d.qty} × ${o("cooking", "fuel")}`;

const GROUPS = [

  ["🏠 Home energy", "Electricity and fuel emissions", ["electricity", "cooking"]],

const iso = t => new Date(t).toISOString().slice(0, 10);
function coveredDays(L) {
  const r = L.map(l => [Date.parse(l.period_start), Date.parse(l.period_end)]).sort((a, b) => a[0] - b[0]);

function estimate(logs, base) {

    const days = !L.length ? 0 : c.event
      ? Math.max(30, (Date.now() - Math.min(...L.map(l => Date.parse(l.period_start)))) / 864e5 + 1)
      : coveredDays(L);
    if (L.length && (c.event || days >= 7)) out[cat] = { kg: kg / Math.min(days, 365) * 365, src: `from ${L.length} logged ${L.length > 1 ? "entries" : "entry"}`, logs: L };
    else if (base[cat] != null) out[cat] = { kg: base[cat], src: L.length ? "questionnaire (log at least a week)" : "questionnaire estimate", logs: L };

// A personalised suggestion for one category, with a rough yearly saving where the data allows it.

      return priv > 0.3 && e.logs.length
        ? `About ${Math.round(priv * 100)}% of your logged travel emissions come from private vehicles. Moving half of those trips to bus or metro would save roughly ${kg(e.kg * priv * 0.5 * 0.8)} kg a year.`
        : "Walk, cycle or take the bus or metro for some trips, and share rides when you can't.";
    }
    case "electricity": return `Cutting electricity use by 15% (fans and lights off when you leave, AC at 24–26 °C, LED bulbs) would save about ${kg(e.kg * 0.15)} kg a year.`;
    case "cooking": return `Pressure cookers, lids on pans and the right burner size cut cooking fuel by 20–30%, about ${kg(e.kg * 0.25)} kg a year for you.`;
    case "food": {

async function readBill(f) {
  const m = $("billmsg");
  if (!f) return;
  if (f.size > 10 * 1024 * 1024) { m.className = "err"; m.textContent = "That file is over 10 MB."; return; }
  if (!["application/pdf", "image/png", "image/webp", "image/jpeg"].includes(f.type)) { m.className = "err"; m.textContent = "Please upload a JPG, PNG, WebP or PDF."; return; }
  m.className = "mute"; m.textContent = "Uploading…";
  let path;
  try { path = await upload("bills", f); } catch (e) { m.className = "err"; m.textContent = e.message; return; }
  billPath = path;
  m.textContent = "Reading your bill… (this can take a few seconds)";
  try {
    const v = await api("/api/bills/extract", { path });
    if (v.kwh != null) $("f_kwh").value = v.kwh;
    if (v.period_start) $("f_start").value = v.period_start;
    if (v.period_end) $("f_end").value = v.period_end;
    m.textContent = v.kwh != null
      ? `We filled in the values from your bill${v.amount_inr != null ? ` (amount ₹${v.amount_inr})` : ""}. Please check them and correct anything that's wrong before saving.`
      : "We couldn't find the units on this bill. Please type them in.";
  } catch (e) { m.className = "mute"; m.textContent = e.message + " Your bill is still attached."; }
}
async function saveLog(cat) {
  const c = LOGS[cat], d = {};
  for (const [id, , opts] of c.fields) d[id] = Array.isArray(opts) ? $("f_" + id).value : +$("f_" + id).value;
  const nums = c.fields.filter(f => !Array.isArray(f[2])).map(f => d[f[0]]);
  if (nums.some(n => !Number.isFinite(n) || n < 0) || !(nums[0] > 0)) return say("Please enter the amounts (numbers above zero).", 1);
  const start = $("f_start").value, end = c.event ? start : $("f_end").value;
  if (!start || !end || end < start) return say("Please check the dates.", 1);
  if (end > iso(Date.now())) return say("Dates can't be in the future.", 1);
  try {
    await api("/api/footprint-logs", { category: cat, period_start: start, period_end: end,
      details: d, kg_co2e: Math.round(logKg(cat, d) * 10) / 10, bill_path: billPath });
  } catch (e) { return say(e.message, 1); }
  show("fp");
}
async function deleteLog(id) {
  if (!confirm("Delete this entry?")) return;
  try { await api(`/api/footprint-logs/${id}`, null, "DELETE"); fp(); } catch (e) { alert(e.message); }
}

  <label for="${p}state">State</label><select id="${p}state"><option value="">Select state…</option>${INDIAN_STATES.map(s => `<option${s === c.state ? " selected" : ""}>${s}</option>`).join("")}</select>
  <div class="row"><span style="flex:1"><label for="${p}city">City</label><input id="${p}city" list="citylist" value="${esc(c.city)}"></span>
    <span style="flex:1"><label for="${p}pin">Pincode</label><input id="${p}pin" inputmode="numeric" maxlength="6" value="${esc(c.pincode)}" placeholder="6 digits"></span></div>`;
function readInst(p) {
  const v = { name: $(p + "name").value.trim(), state: $(p + "state").value, city: $(p + "city").value.trim(), pincode: $(p + "pin").value.trim() };
  if (!v.name) return "Enter the institution's name.";
  if (!v.state) return "Select the state.";
  if (!v.city) return "Enter the city.";
  if (!/^[1-9][0-9]{5}$/.test(v.pincode)) return "Enter a valid 6-digit pincode.";
  return v;
}
async function institutionsView() {
  $("app").innerHTML = adminHeader() + `<div class="card"><h3>➕ Add an institution</h3>${instFields("in_")}
    <label for="in_fee">Yearly membership fee (₹)</label><input id="in_fee" type="number" min="0" step="1" value="199">
    <p class="mute">The new institution gets this year's academic calendar, all current activities and the certificate rules, copied from yours. Students can choose it when they sign up straight away.</p>
    <button onclick="addInstitution()">Add institution</button><p id="imsg"></p></div>
  <div class="card"><h3>📤 Bulk upload from Excel</h3>
    <p class="mute">Add many institutions at once from an Excel (.xlsx, .xls) or CSV file with the columns <b>Institution name, City, State, Pincode</b> and optionally <b>Yearly fee</b> (₹199 if left empty). Nothing is saved until you've checked the preview.</p>
    <p class="row" style="justify-content:flex-start;flex-wrap:wrap"><button class="s o" onclick="downloadTemplate()">⬇ Download template</button>
      <label class="s" style="display:inline-block;cursor:pointer;background:var(--pri);color:#fff;border-radius:12px;padding:.35rem .8rem;font-weight:700;border-bottom:3px solid var(--prid)">📂 Choose file
        <input type="file" accept=".xlsx,.xls,.csv" onchange="readSheet(this.files[0]);this.value=''" hidden></label></p>
    <p id="bmsg" class="mute"></p><div id="bq"></div></div>
  <div class="card" id="sec_main"><div class="row" style="flex-wrap:wrap"><h3>🏫 Institutions</h3>
    <input id="isearch" type="search" placeholder="Search name, city, state or pincode" style="max-width:320px;margin:0" oninput="renderInstTable()" aria-label="Search institutions"></div>
    <p id="msg" class="mute">Loading…</p><div id="q"></div></div><datalist id="citylist"></datalist>`;
  loadStats();
  try {
    instList = await api("/api/super/institutions", null, "GET");

// Institutions as a table: one row each, actions on the right; Edit opens a form row underneath.
function renderInstTable() {
  const q = ($("isearch").value || "").trim().toLowerCase();
  const rows = instList.filter(c => !q || [c.name, c.city, c.state, c.pincode].some(v => (v || "").toLowerCase().includes(q)));
  const gaps = instList.filter(c => !c.city || !c.state || !c.pincode).length;
  say(`${rows.length} of ${instList.length} institution${instList.length === 1 ? "" : "s"}${gaps ? ` · ⚠ ${gaps} missing city, state or pincode – use Edit to complete them` : ""}`);
  if (!rows.length) { $("q").innerHTML = `<p class="mute">No institutions match “${esc(q)}”.</p>`; return; }
  $("q").innerHTML = `<p class="mute" style="font-size:.8rem;margin:.2rem 0">◀ Scroll sideways for more columns – the institution name stays in place ▶</p>
    <div class="topscroll" id="itop"><div></div></div>
    <div class="tbl freeze" id="itbl"><table>
    <thead><tr><th class="fz1">#</th><th class="fz2">Institution</th><th>City</th><th>State</th><th>Pincode</th><th class="n">Students</th><th>Admins</th><th>Status</th><th>Actions</th></tr></thead>
    <tbody>${rows.map((c, i) => instRow(c, i + 1)).join("")}</tbody></table></div>`;
  syncTopScroll();
}
// A second scrollbar above the table, kept in step with the one below it.
function syncTopScroll(topId = "itop", tblId = "itbl") {
  const top = $(topId), tbl = $(tblId);
  if (!top || !tbl) return;
  const size = () => { top.firstChild.style.width = tbl.scrollWidth + "px"; top.hidden = tbl.scrollWidth <= tbl.clientWidth; };
  size();
  const link = (from, to) => from.onscroll = () => { if (to.scrollLeft !== from.scrollLeft) to.scrollLeft = from.scrollLeft; };
  link(top, tbl); link(tbl, top);
  window.onresize = size;
}
function instRow(c, n) {
  const own = c.id === me.college_id;
  return `<tr id="ir_${c.id}"><td class="mute fz1">${n}</td>
  <td class="fz2"><b>${esc(c.name)}</b>${own ? `<br><span class="mute" style="font-size:.8rem">your institution</span>` : ""}${c.added_by ? `<br><span class="mute" style="font-size:.8rem">added by a student – check it, then switch it on</span>` : ""}${c.website ? `<br><a href="${esc(c.website)}" target="_blank" rel="noopener" style="color:var(--prid);font-size:.8rem">website</a>` : ""}</td>
  ${[c.city, c.state, c.pincode].map(v => `<td>${v ? esc(v) : `<span class="warn" style="padding:.1rem .4rem">missing</span>`}</td>`).join("")}
  <td class="n">${c.students}</td>
  <td style="font-size:.85rem">${c.admins.length ? c.admins.map(esc).join("<br>") : `<span class="mute">None</span>`}</td>
  <td><span class="pill"${c.active ? "" : ` style="background:var(--line);color:var(--mute)"`}>${c.active ? "Active" : "Off"}</span></td>
  <td class="acts"><button class="s o" onclick="editInst('${c.id}')">Edit</button> <button class="s o" onclick="makeAdmin('${c.id}')">+ Admin</button>
    ${own ? "" : `<button class="s o" onclick="setActive('${c.id}',${!c.active})">${c.active ? "Switch off" : "Switch on"}</button>
    <button class="s o danger" onclick="deleteInst('${c.id}')"${c.students ? ` title="Has students: switch it off instead"` : ""}>Delete</button>`}</td></tr>`;
}
// ---- Bulk upload: read a spreadsheet in the browser, check every row, then import the valid ones ----
let bulkRows = [];
const loadXLSX = () => window.XLSX ? Promise.resolve() : new Promise((ok, fail) => {
  const s = document.createElement("script");
  s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
  s.onload = ok; s.onerror = () => fail(new Error("Couldn't load the Excel reader. Check your connection and try again."));
  document.head.appendChild(s);
});
const TEMPLATE_COLS = ["Institution name", "City", "State", "Pincode", "Yearly fee"];
async function downloadTemplate() {
  try {
    await loadXLSX();
    const ws = XLSX.utils.aoa_to_sheet([TEMPLATE_COLS]);
    ws["!cols"] = [{ wch: 42 }, { wch: 16 }, { wch: 18 }, { wch: 10 }, { wch: 11 }];
    const help = XLSX.utils.aoa_to_sheet([["How to fill in the Institutions sheet"], [],
      ["Institution name", "Required. Full official name, e.g. RV College of Engineering"],
      ["City", "Required, e.g. Bengaluru"],
      ["State", "Required. An Indian state or union territory, spelt out, e.g. Karnataka"],
      ["Pincode", "Required. 6 digits, e.g. 560059"],
      ["Yearly fee", "Optional. Membership fee in rupees; ₹199 if left empty"], [],
      ["One institution per row, up to 500 rows. You can fix any problems in the preview before saving."]]);
    help["!cols"] = [{ wch: 18 }, { wch: 70 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Institutions"); XLSX.utils.book_append_sheet(wb, help, "Instructions");
    XLSX.writeFile(wb, "greenxp-institutions-template.xlsx");
  } catch (e) { $("bmsg").className = "err"; $("bmsg").textContent = e.message; }
}
// Accepts common spellings of the column headers and of state names.
const HEADERS = { name: ["institution name", "institution", "name", "college name", "college"], city: ["city", "town"],
  state: ["state", "state/ut", "state / ut"], pincode: ["pincode", "pin code", "pin", "postal code", "zip"], fee: ["yearly fee", "fee", "annual fee", "membership fee"] };
const STATE_ALIASES = { orissa: "Odisha", "new delhi": "Delhi", "nct of delhi": "Delhi", pondicherry: "Puducherry", "j&k": "Jammu and Kashmir",
  "jammu & kashmir": "Jammu and Kashmir", "andaman & nicobar islands": "Andaman and Nicobar Islands", uttaranchal: "Uttarakhand", tamilnadu: "Tamil Nadu" };
const normState = s => { const k = String(s || "").trim().toLowerCase(); return INDIAN_STATES.find(x => x.toLowerCase() === k) || STATE_ALIASES[k] || ""; };
async function readSheet(file) {
  const m = $("bmsg");
  if (!file) return;
  m.className = "mute"; m.textContent = "Reading " + file.name + "…"; $("bq").innerHTML = "";
  try {
    await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer());
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: false });
    if (!raw.length) throw new Error("The first sheet has no rows under the headings.");
    const keys = Object.keys(raw[0]), col = {};
    for (const [field, names] of Object.entries(HEADERS)) col[field] = keys.find(k => names.includes(k.trim().toLowerCase()));
    const missing = ["name", "city", "state", "pincode"].filter(f => !col[f]);
    if (missing.length) throw new Error(`Couldn't find these columns: ${missing.map(f => HEADERS[f][0]).join(", ")}. Use the template's headings.`);
    if (raw.length > 500) throw new Error(`The file has ${raw.length} rows; upload at most 500 at a time.`);
    bulkRows = raw.map((r, i) => {
      const stateIn = String(r[col.state]).trim();
      return { line: i + 2, name: String(r[col.name]).trim(), city: String(r[col.city]).trim(), stateIn, state: normState(stateIn),
        pincode: String(r[col.pincode]).replace(/\s/g, ""), fee: col.fee ? String(r[col.fee]).replace(/[₹,\s]/g, "") : "" };
    }).filter(v => v.name || v.city || v.stateIn || v.pincode); // skip fully blank lines
    if (!bulkRows.length) throw new Error("The file has headings but no institutions under them.");
    // Drop duplicates straight away: names that already exist, and repeats within the file (the first is kept).
    const existing = new Set(instList.map(c => c.name.trim().toLowerCase())), seen = new Set(), dropped = [];
    bulkRows = bulkRows.filter(r => {
      const key = r.name.trim().toLowerCase();
      if (!key) return true;
      if (existing.has(key) || seen.has(key)) { dropped.push(`${r.name} (row ${r.line}, ${existing.has(key) ? "already exists" : "repeated in file"})`); return false; }
      seen.add(key); return true;
    });
    bulkDropped = dropped;
    renderBulk();
  } catch (e) { m.className = "err"; m.textContent = e.message; }
}
let bulkDropped = [];
const validPin = p => /^[1-9][0-9]{5}$/.test(p);
// Re-checks every unsaved row. Only the name is required (and it must be unique); missing or invalid city,
// state, pincode or fee don't block saving: they're saved empty (fee ₹199) and listed as notes to fix later.
function validateBulk() {
  const existing = new Set(instList.map(c => c.name.trim().toLowerCase())), seen = new Set();
  for (const r of bulkRows) {
    if (r.result === "created") continue;
    const key = r.name.trim().toLowerCase(), p = [], n = [];
    if (!key) p.push("name missing");
    else if (existing.has(key)) p.push("already exists");
    else if (seen.has(key)) p.push("repeated in this file");
    if (key) seen.add(key);
    if (r.serverError) p.push(r.serverError);
    if (!r.city.trim()) n.push("no city");
    if (!r.state) n.push(r.stateIn ? `state "${r.stateIn}" not recognised` : "no state");
    if (!validPin(r.pincode)) n.push(r.pincode ? `pincode "${r.pincode}" not 6 digits` : "no pincode");
    if (r.fee !== "" && !(+r.fee >= 0)) n.push("fee not a number, ₹199 used");
    r.problem = p.join("; "); r.note = n.join(", ");
  }
}
const cell = (i, f, v, attrs = "") => `<input value="${esc(v)}" ${attrs} oninput="editBulk(${i},'${f}',this.value)" aria-label="${f} for row ${i + 1}" style="margin:0;padding:.35rem .5rem;min-width:0">`;
function renderBulk() {
  validateBulk();
  const bar = id => `<div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin:.5rem 0"><button id="${id}" onclick="saveBulk(this)"></button>
    <button class="o" onclick="cancelBulk()">Cancel</button></div>`;
  $("bq").innerHTML = bar("bsave1") + `<div class="tbl" style="max-height:420px;overflow:auto"><table><thead><tr><th>Row</th><th>Institution name</th><th>City</th><th>State</th><th>Pincode</th><th>Fee (₹)</th><th>Status</th><th></th></tr></thead><tbody>` +
    bulkRows.map((r, i) => r.result === "created"
      ? `<tr><td class="mute">${r.line}</td><td>${esc(r.name)}</td><td>${esc(r.city)}</td><td>${esc(r.state)}</td><td>${esc(r.pincode)}</td><td>${r.fee === "" ? 199 : esc(r.fee)}</td><td>✅ Saved</td><td></td></tr>`
      : `<tr><td class="mute">${r.line}</td><td style="min-width:220px">${cell(i, "name", r.name)}</td><td>${cell(i, "city", r.city, 'list="citylist"')}</td>
        <td><select onchange="editBulk(${i},'state',this.value)" aria-label="state for row ${i + 1}" style="margin:0;padding:.35rem .5rem">
          <option value="">${r.stateIn && !r.state ? "⚠ " + esc(r.stateIn) : "Select…"}</option>${INDIAN_STATES.map(s => `<option${s === r.state ? " selected" : ""}>${s}</option>`).join("")}</select></td>
        <td>${cell(i, "pincode", r.pincode, 'inputmode="numeric" maxlength="6" style="width:7.5em"')}</td><td>${cell(i, "fee", r.fee, 'inputmode="numeric" placeholder="199" style="width:5.5em"')}</td>
        <td id="bs_${i}" style="white-space:normal;min-width:160px"></td>
        <td><button class="s o" onclick="bulkRows.splice(${i},1);renderBulk()" aria-label="Remove row ${r.line}" title="Remove this row">✕</button></td></tr>`).join("") +
    `</tbody></table></div>` + bar("bsave2");
  updateBulkStatus();
}
function editBulk(i, field, value) {
  const r = bulkRows[i];
  r[field] = field === "pincode" ? value.replace(/\s/g, "") : value;
  if (field === "state") r.stateIn = value;
  r.serverError = "";
  validateBulk(); updateBulkStatus();
}
// Updates the status column, summary and Save buttons without redrawing the inputs (so typing isn't interrupted).
function updateBulkStatus() {
  bulkRows.forEach((r, i) => { const s = $("bs_" + i); if (s) s.innerHTML = r.problem ? `<span class="err" style="font-weight:400">❌ ${esc(r.problem)}</span>`
    : r.note ? `✔ Ready <span class="mute" style="font-size:.8rem">· ⚠ ${esc(r.note)} – saved empty, fill in later with Edit</span>` : "✔ Ready"; });
  const ready = bulkRows.filter(r => !r.problem && r.result !== "created").length, bad = bulkRows.filter(r => r.problem).length;
  const saved = bulkRows.filter(r => r.result === "created").length, incomplete = bulkRows.filter(r => !r.problem && r.result !== "created" && r.note).length;
  $("bmsg").className = bad ? "err" : "mute";
  $("bmsg").innerHTML = esc((saved ? `✅ ${saved} saved. ` : "") + (ready || bad
    ? `${ready} ready to save${incomplete ? ` (${incomplete} with missing details you can add later)` : ""}${bad ? `, ${bad} need a name or a different name – edit or remove them with ✕` : ""}.` : "All done.")) +
    (bulkDropped.length ? `<br><span class="mute">🗑 ${bulkDropped.length} duplicate${bulkDropped.length > 1 ? "s" : ""} removed from the file: ${esc(bulkDropped.join("; "))}</span>` : "");
  for (const id of ["bsave1", "bsave2"]) {
    const b = $(id); if (!b) continue;
    b.disabled = !ready;
    b.textContent = ready ? `💾 Save ${ready} institution${ready > 1 ? "s" : ""}` : bad ? "💾 Save (rows marked ❌ need a name first)" : "💾 Nothing left to save";
  }
}
function cancelBulk() {
  if (bulkRows.some(r => r.result !== "created") && !confirm("Discard this upload? Rows that aren't saved yet will be lost.")) return;
  bulkRows = []; bulkDropped = []; $("bq").innerHTML = ""; $("bmsg").textContent = "";
}
async function saveBulk(btn) {
  const ready = bulkRows.filter(r => !r.problem && r.result !== "created");
  if (!ready.length) return;
  if (!confirm(`Save ${ready.length} institution${ready.length > 1 ? "s" : ""}? Each gets this year's calendar, activities and certificate rules, and appears in the sign-up list.`)) return;
  document.querySelectorAll("#bsave1,#bsave2").forEach(b => { b.disabled = true; b.textContent = "Saving…"; });
  try {
    const r = await api("/api/super/institutions/bulk", { rows: ready.map(({ name, city, state, pincode, fee }) =>
      ({ name: name.trim(), city: city.trim(), state: state || "", pincode: validPin(pincode) ? pincode : "", fee: fee !== "" && +fee >= 0 ? +fee : 199 })) });
    r.results.forEach((res, i) => { if (res.ok) ready[i].result = "created"; else ready[i].serverError = res.error; });
    const keep = bulkRows, dropKeep = bulkDropped;
    await institutionsView(); // refresh the institutions table, then bring the upload preview back
    bulkRows = keep; bulkDropped = dropKeep; renderBulk();
    $("bq").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) { $("bmsg").className = "err"; $("bmsg").textContent = e.message; updateBulkStatus(); }
}
async function deleteInst(id) {
  const c = instList.find(x => x.id === id);
  if (c.students) return say(`${c.name} has ${c.students} student${c.students > 1 ? "s" : ""}, so it can't be deleted. Use Switch off to hide it from sign-up instead.`, 1);
  const typed = prompt(`This permanently deletes ${c.name}, with its academic year, fee, activities and certificate rules.\n\nType the institution's name to confirm:`);
  if (typed == null) return;
  if (typed.trim().toLowerCase() !== c.name.trim().toLowerCase()) return say("The name didn't match, so nothing was deleted.", 1);
  try { await api(`/api/super/institutions/${id}/delete`, {}); await institutionsView(); say(`🗑 ${c.name} deleted.`); }
  catch (e) { say(e.message, 1); }
}
function editInst(id) {
  const c = instList.find(x => x.id === id), p = "e_" + id.slice(0, 8) + "_";
  document.querySelectorAll("tr.editrow").forEach(r => r.remove());
  $("ir_" + id).insertAdjacentHTML("afterend", `<tr class="editrow"><td colspan="10"><div style="max-width:520px"><b>Edit ${esc(c.name)}</b>${instFields(p, c)}
    <p><button class="s" onclick="saveInst('${id}','${p}')">Save</button> <button class="s o" onclick="this.closest('tr').remove()">Cancel</button></p><p id="${p}msg"></p></div></td></tr>`);
}
async function saveInst(id, p) {
  const v = readInst(p), m = $(p + "msg");
  if (typeof v === "string") { m.className = "err"; m.textContent = v; return; }
  try { await api(`/api/super/institutions/${id}`, v); await institutionsView(); say(`✅ ${v.name} updated.`); }
  catch (e) { m.className = "err"; m.textContent = e.message; }
}
async function addInstitution() {
  const m = $("imsg"), v = readInst("in_"), fee = $("in_fee").value;
  if (typeof v === "string") { m.className = "err"; m.textContent = v; return; }
  if (fee === "" || !(+fee >= 0)) { m.className = "err"; m.textContent = "Enter the yearly fee (0 or more)."; return; }
  try {
    await api("/api/super/institutions", { ...v, fee });
    await institutionsView();
    $("imsg").className = "mute"; $("imsg").textContent = `✅ ${v.name} added. Students can now choose it when signing up.`;
  } catch (e) { m.className = "err"; m.textContent = e.message; }
}
async function makeAdmin(id) {
  const c = instList.find(x => x.id === id);
  const email = (prompt(`Make someone an admin of ${c.name}.\nThey'll be able to approve its students and activities.\n\nEmail they signed up with:`) || "").trim();
  if (!email) return;
  try { await api(`/api/super/institutions/${id}/admin`, { email }); await institutionsView(); say(`✅ ${email} is now an admin.`); }
  catch (e) { say(e.message, 1); }
}
async function setActive(id, active) {
  if (!active && !confirm("Switch off this institution? It will disappear from the sign-up list. Existing accounts keep working.")) return;
  try { await api(`/api/super/institutions/${id}/active`, { active }); institutionsView(); } catch (e) { say(e.message, 1); }
}
async function issueAll() {
  if (!confirm("Issue year-end certificates now?")) return;
  try { const r = await api("/api/admin/certificates/issue"); $("cmsg").textContent = `${r.issued} certificate(s) issued.`; }
  catch (e) { $("cmsg").className = "err"; $("cmsg").textContent = e.message; }
}
init();
