<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenXP</title>
<style>
:root{--bg:#effaf5;--card:#fff;--ink:#0e3b36;--mute:#4f7a73;--line:#cfe9df;--pri:#19b37a;--prid:#0f8a5c;--xp:#ffc83d}
@media(prefers-color-scheme:dark){:root{--bg:#0a1f1c;--card:#12322d;--ink:#e6f6f1;--mute:#8fbdb3;--line:#1f4a43}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
.app{max-width:520px;margin:auto;padding:1rem 1rem 5.5rem}h1,h2,h3{margin:.2rem 0 .5rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.7rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem}.mute{color:var(--mute);font-size:.9rem}
button{font:700 1rem system-ui;border:0;border-radius:12px;padding:.65rem 1rem;background:var(--pri);color:#fff;cursor:pointer;border-bottom:3px solid var(--prid)}
button.o{background:transparent;color:var(--prid);border:2px solid var(--line)}button.s{padding:.35rem .8rem;font-size:.9rem}
input,select{width:100%;font:inherit;padding:.65rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:.2rem 0 .6rem}
.pill{background:var(--xp);color:#4a3500;border-radius:99px;padding:.1rem .6rem;font-weight:700;font-size:.85rem}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:.3rem;background:var(--card);border-top:2px solid var(--line);padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;color:var(--mute);border:0;padding:.4rem .7rem}.tabs button.on{color:var(--prid);background:var(--line)}
.err{color:#b3261e;font-weight:700}.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
</style></head>
<body><div class="app" id="app">Loading…</div><nav class="tabs" id="tabs" hidden></nav>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const db = supabase.createClient(GXP.SUPABASE_URL, GXP.SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const LV = [[0,"Eco Starter","🌱"],[100,"Green Rookie","🍃"],[300,"Green Warrior","🌿"],[600,"Eco Champion","🌳"],[1000,"Planet Hero","🌎"],[2000,"Eco Legend","🏆"]];
let me = null, tab = "home", acts = {};
async function api(path, body, method = "POST") {
  const { data: { session } } = await db.auth.getSession();
  if (!session) throw new Error("Your session has expired. Please log in again.");
  const r = await fetch(GXP.API_URL + path, { method, headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
const say = (m, bad) => { const e = $("msg"); if (e) { e.textContent = m; e.className = bad ? "err" : "mute"; } };
const currentYear = async () => (await db.from("academic_years").select("id").eq("college_id", me.college_id).eq("is_current", true).maybeSingle()).data;

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return authScreen();
  me = (await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle()).data;
  if (!me) {
    $("tabs").hidden = true;
    $("app").innerHTML = `<div class="card"><p>Your account is still being set up.</p><button onclick="init()">Try again</button> <button class="o" onclick="db.auth.signOut().then(init)">Log out</button></div>`;
    return;
  }
  if (!me.usn || !me.department) return profileScreen();
  me.survey = (await db.from("lifestyle_surveys").select("*").eq("user_id", me.id).maybeSingle()).data;
  if (!me.survey) return surveyScreen();
  // Only a membership for the current academic year unlocks the app.
  const y = await currentYear();
  const { data: m } = y ? await db.from("memberships").select("status").eq("user_id", me.id).eq("academic_year_id", y.id).in("status", ["active", "waived"]).limit(1) : { data: null };
  if (!m || !m.length) return payScreen(y);
  $("tabs").hidden = false; show("home");
}
async function authScreen() {
  $("tabs").hidden = true;
  const { data: cs } = await db.from("colleges").select("id,name");
  $("app").innerHTML = `<h1>🌱 GreenXP</h1><p class="mute">Earn XP. Go Green. Make an Impact.</p><div class="card">
  <label>College</label><select id="col">${(cs||[]).map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select>
  <label>Full name (sign-up only)</label><input id="nm"><label>Email</label><input id="em" type="email"><label>Password</label><input id="pw" type="password">
  <div class="row"><button onclick="signup()">Sign up</button><button class="o" onclick="login()">Log in</button></div><p id="msg"></p></div>`;
}
async function signup() {
  const { error } = await db.auth.signUp({ email: $("em").value, password: $("pw").value, options: { data: { full_name: $("nm").value, college_id: $("col").value } } });
  if (error) return say(error.message, 1);
  say("Account created. If email confirmation is on, check your inbox, then log in.");
}
async function login() {
  const { error } = await db.auth.signInWithPassword({ email: $("em").value, password: $("pw").value });
  error ? say(error.message, 1) : init();
}
function profileScreen() {
  $("app").innerHTML = `<h2>Your details</h2><div class="card"><label>USN</label><input id="usn"><label>Department</label>
  <select id="dep">${["CSE","ISE","ECE","EEE","ME"].map(d => `<option>${d}</option>`).join("")}</select>
  <label>Year</label><input id="yr" type="number" min="1" max="4" value="1"><label>Mobile (never shown publicly)</label><input id="ph">
  <label><input type="checkbox" id="ok" style="width:auto"> I accept the Terms, Privacy and Refund policies and understand points are not carbon credits.</label>
  <p><button onclick="saveProfile()">Continue</button></p><p id="msg"></p></div>`;
}
async function saveProfile() {
  if (!$("usn").value.trim() || !$("ok").checked) return say("Add your USN and accept the terms.", 1);
  const { error } = await db.from("profiles").update({ usn: $("usn").value.trim(), department: $("dep").value, year: +$("yr").value, phone: $("ph").value }).eq("id", me.id);
  error ? say(error.message, 1) : init();
}

// Baseline lifestyle questionnaire: [section, [[id, question, [[value, label], ...]], ...]]
const SURVEY = [
  ["🏠 Home", [
    ["household", "How many people share your home (or hostel room)?", [["1","Just me"],["2","2"],["4","3–4"],["6","5 or more"]]],
    ["residence", "Where do you live?", [["hostel","Hostel / PG"],["apartment","Apartment / flat"],["house","Independent house"]]]]],
  ["🚌 Travel", [
    ["mode", "How do you usually travel to college?", [["walk","Walk / cycle"],["public","Bus / metro / train"],["two","Two-wheeler"],["auto","Auto / cab"],["car","Car"]]],
    ["distance", "Typical daily round-trip distance?", [["3","Under 5 km"],["10","5–15 km"],["22","15–30 km"],["40","Over 30 km"]]]]],
  ["⚡ Energy", [
    ["units", "Household electricity use per month?", [["75","Under 100 units (bill under ₹500)"],["150","100–200 units (₹500–1,200)"],["300","200–400 units (₹1,200–3,000)"],["500","Over 400 units (over ₹3,000)"],["0","Don't know"]]],
    ["cooking", "Main cooking fuel where you eat?", [["lpg","LPG cylinder"],["png","Piped gas (PNG)"],["electric","Electric / induction"],["biomass","Wood / biomass"],["mess","I eat at a mess / canteen"]]]]],
  ["🍽 Food", [
    ["diet", "Which best describes your diet?", [["vegan","Vegan"],["veg","Vegetarian"],["egg","Vegetarian + eggs"],["nonveg_some","Non-veg a few times a week"],["nonveg_daily","Non-veg daily"]]],
    ["waste", "How often is food wasted on your plate or at home?", [["rare","Rarely"],["sometimes","Sometimes"],["often","Often"]]],
    ["delivery", "How often do you order food delivery?", [["rare","Rarely"],["weekly","About once a week"],["often","Several times a week"]]]]],
  ["🛍 Shopping", [
    ["clothes", "New clothes bought per year?", [["low","0–5 items"],["mid","6–15 items"],["high","16+ items"]]],
    ["online", "Online orders per month?", [["low","0–2"],["mid","3–8"],["high","9+"]]],
    ["devices", "How often do you replace your phone or laptop?", [["low","Every 4+ years"],["mid","Every 2–3 years"],["high","Every year"]]]]],
  ["💧 Water & waste", [
    ["bath", "How do you usually bathe?", [["bucket","Bucket"],["short","Shower, under 10 min"],["long","Shower, over 10 min"]]],
    ["segregate", "Do you separate wet and dry waste?", [["always","Always"],["sometimes","Sometimes"],["never","Never"]]],
    ["plastic", "How often do you use single-use plastic (bags, bottles, cups)?", [["rare","Rarely"],["sometimes","Sometimes"],["daily","Daily"]]]]]
];
// Footprint categories, with the tip and matching activity categories shown when it is one of a student's biggest.
const CATS = {
  Energy:    { label: "Energy", icon: "⚡", acts: ["Energy"], tip: "Switch off fans, lights and chargers when you leave a room, keep the AC at 24–26 °C, and pick LED and 5-star appliances." },
  Transport: { label: "Transport", icon: "🚌", acts: ["Transport"], tip: "Walk, cycle or take the bus or metro for some trips, and share rides when you can't." },
  Food:      { label: "Food", icon: "🍽", acts: ["Food"], tip: "Take only what you'll eat, try more plant-based meals, and cook or eat at the mess instead of ordering in." },
  Shopping:  { label: "Shopping", icon: "🛍", acts: ["Reuse", "Recycling"], tip: "Buy fewer, longer-lasting clothes, repair before replacing, and recycle old electronics properly." },
  Water:     { label: "Water & waste", icon: "💧", acts: ["Water", "Waste"], tip: "Use a bucket or keep showers short, segregate waste, and carry a reusable bottle and bag." }
};
const INDIA_AVG_T = 1.9; // approx. per-person tonnes CO2e per year in India
// Rough yearly kg CO2e per person from the answers, using typical Indian emission factors.
function footprint(a) {
  const hh = +a.household;
  const units = +a.units || { hostel: 40, apartment: 50, house: 70 }[a.residence] * hh; // "don't know": typical per-person use
  const cook = { lpg: 340, png: 300, electric: 0, biomass: 400 }; // per household per year
  const f = {
    Energy: units * 12 * 0.71 / hh + (a.cooking === "mess" ? 100 : cook[a.cooking] / hh), // grid ~0.71 kg/kWh
    Transport: +a.distance * 300 * { walk: 0, public: 0.03, two: 0.05, auto: 0.12, car: 0.17 }[a.mode], // ~300 travel days
    Food: { vegan: 700, veg: 900, egg: 1000, nonveg_some: 1200, nonveg_daily: 1600 }[a.diet]
      + { rare: 0, sometimes: 50, often: 150 }[a.waste] + { rare: 0, weekly: 50, often: 150 }[a.delivery],
    Shopping: { low: 50, mid: 150, high: 350 }[a.clothes] + { low: 20, mid: 60, high: 150 }[a.online] + { low: 50, mid: 100, high: 250 }[a.devices],
    Water: { bucket: 20, short: 40, long: 80 }[a.bath] + { always: 30, sometimes: 80, never: 150 }[a.segregate] + { rare: 10, sometimes: 40, daily: 100 }[a.plastic]
  };
  for (const k in f) f[k] = Math.round(f[k]);
  return f;
}
function surveyScreen() {
  const prev = me.survey?.answers || {};
  $("app").innerHTML = `<h2>Your green baseline</h2><p class="mute">15 quick questions about your everyday life. We use them to estimate your carbon footprint and show where you can make the biggest difference.</p>` +
    SURVEY.map(([title, qs]) => `<div class="card"><h3>${title}</h3>` + qs.map(([id, q, opts]) =>
      `<label for="q_${id}">${q}</label><select id="q_${id}"><option value="">Choose…</option>${opts.map(([v, t]) => `<option value="${v}"${prev[id] === v ? " selected" : ""}>${t}</option>`).join("")}</select>`).join("") + `</div>`).join("") +
    `<p><button onclick="saveSurvey()">See my analysis</button>${me.survey ? ` <button class="o" onclick="init()">Cancel</button>` : ""}</p><p id="msg"></p>`;
}
async function saveSurvey() {
  const a = {};
  for (const [, qs] of SURVEY) for (const [id] of qs) a[id] = $("q_" + id).value;
  if (Object.values(a).some(v => !v)) return say("Please answer every question.", 1);
  const f = footprint(a), total = Object.values(f).reduce((x, y) => x + y, 0);
  const { data, error } = await db.from("lifestyle_surveys")
    .upsert({ user_id: me.id, answers: a, footprint: f, total_kg: total, updated_at: new Date().toISOString() }).select().single();
  if (error) return say(error.message, 1);
  me.survey = data;
  analysisScreen();
}
async function analysisScreen() {
  const f = me.survey.footprint, t = me.survey.total_kg / 1000;
  const max = Math.max(1, ...Object.keys(CATS).map(k => f[k]));
  const top = Object.keys(CATS).sort((x, y) => f[y] - f[x]).slice(0, 2);
  const { data: acts } = await db.from("activities").select("name,category,xp_value").eq("active", true).in("category", top.flatMap(k => CATS[k].acts));
  const diff = Math.round((t / INDIA_AVG_T - 1) * 100);
  const cmp = Math.abs(diff) < 10 ? `About the same as India's average of ${INDIA_AVG_T} t per person.`
    : `${Math.abs(diff)}% ${diff > 0 ? "above" : "below"} India's average of ${INDIA_AVG_T} t per person.`;
  $("app").innerHTML = `<h2>Your footprint</h2><div class="card"><b style="font-size:1.8rem">${t.toFixed(1)} t CO₂e</b> <span class="mute">per year (estimate)</span><p class="mute">${cmp}</p>` +
    Object.entries(CATS).map(([k, c]) => `<div class="row"><span>${c.icon} ${c.label}</span><b>${f[k]} kg</b></div><div class="bar" style="margin:.2rem 0 .7rem"><i style="width:${Math.round(f[k] / max * 100)}%"></i></div>`).join("") + `</div>
    <h3>Where you can make the biggest difference</h3>` +
    top.map(k => `<div class="card"><b>${CATS[k].icon} ${CATS[k].label}</b><p>${CATS[k].tip}</p>` +
      (acts || []).filter(a => CATS[k].acts.includes(a.category)).map(a => `<span class="pill" style="display:inline-block;margin:.15rem 0">${esc(a.name)} +${a.xp_value} XP</span>`).join(" ") + `</div>`).join("") +
    `<p class="mute" style="font-size:.8rem">A rough estimate from typical Indian emission factors, to show where your biggest impact is. It is not a certified measurement.</p>
    <p><button onclick="init()">Continue</button> <button class="o" onclick="surveyScreen()">Retake questionnaire</button></p>`;
}

async function payScreen(y) {
  const { data: f } = y ? await db.from("fee_settings").select("amount,currency").eq("college_id", me.college_id).eq("academic_year_id", y.id).eq("active", true).maybeSingle() : { data: null };
  $("app").innerHTML = `<h2>Activate your year</h2><div class="card"><h1>₹${f ? f.amount : "-"}</h1><p class="mute">Includes XP tracking, badges, challenges, leaderboards and your annual certificate.</p>
  <button id="paybtn" onclick="pay()">Pay now</button><p id="msg"></p></div>`;
}
async function pay() {
  const b = $("paybtn");
  if (b.disabled) return;
  b.disabled = true; say("Starting payment…");
  try {
    const o = await api("/api/payments/create-order");
    say("");
    new Razorpay({ key: o.keyId, order_id: o.orderId, amount: o.amount, currency: o.currency, name: "GreenXP",
      handler: async r => { try { await api("/api/payments/verify", r); init(); } catch (e) { say(e.message, 1); } } }).open();
  } catch (e) { say(e.message, 1); }
  finally { b.disabled = false; }
}
function show(t) {
  tab = t;
  const T = [["home","🏠 Home"],["earn","⭐ Earn"],["ranks","🏆 Ranks"],["cert","🎓 Certificate"]];
  if (["admin","super_admin"].includes(me.role)) T.push(["admin","🛠 Admin"]);
  $("tabs").innerHTML = T.map(x => `<button class="${x[0]==t?"on":""}" onclick="show('${x[0]}')">${x[1]}</button>`).join("") + `<button onclick="db.auth.signOut().then(init)">Out</button>`;
  ({ home, earn, ranks, cert, admin })[t]();
}
async function home() {
  const { data } = await db.rpc("my_xp_summary"); const s = data && data[0] || { earned: 0, spendable: 0, year_earned: 0 };
  const e = +s.earned, l = [...LV].reverse().find(x => e >= x[0]), n = LV.find(x => x[0] > e), p = n ? Math.round((e - l[0]) / (n[0] - l[0]) * 100) : 100;
  $("app").innerHTML = `<h2>Hi ${esc((me.full_name||"").split(" ")[0])} ${l[2]}</h2><div class="card"><div class="row"><b style="font-size:1.8rem">${e} XP</b><span class="pill">${l[1]}</span></div>
  <div class="bar" style="margin:.6rem 0"><i style="width:${p}%"></i></div><span class="mute">${n ? n[0]-e+" XP to "+n[1] : "Top level"} · ${s.spendable} XP to spend · ${s.year_earned} XP this year</span></div>
  ${me.survey ? `<div class="card"><div class="row"><span>🌍 Your footprint</span><b>${(me.survey.total_kg / 1000).toFixed(1)} t CO₂e / year</b></div><p><button class="s o" onclick="analysisScreen()">View analysis</button></p></div>` : ""}
  <p class="mute">GreenXP points are reward points, not carbon credits or money.</p>`;
}
async function earn() {
  const { data, error } = await db.from("activities").select("*").eq("active", true).order("category");
  acts = Object.fromEntries((data||[]).map(a => [a.id, a]));
  if (error || !data.length) {
    $("app").innerHTML = `<h2>Earn XP</h2><p class="${error ? "err" : "mute"}">${error ? "Could not load activities. Please refresh or log in again." : "No activities yet. Check back soon."}</p>`;
    return;
  }
  $("app").innerHTML = `<h2>Earn XP</h2><p id="msg" class="mute"></p>` + data.map(a => `<div class="card row"><div><b>${esc(a.name)}</b><br><span class="mute">${esc(a.category)} · ${a.frequency_limit} per ${a.frequency_period} · ${({self:"instant",photo:"photo",photo_admin:"photo + admin",qr_event:"event code",automatic:"automatic"})[a.verification_type]}</span></div>
  ${a.verification_type==="automatic" ? '<span class="mute">Auto</span>' : `<span><span class="pill">+${a.xp_value}</span> <button class="s" onclick="doAct('${esc(a.id)}')">Go</button></span>`}</div>`).join("");
}
async function doAct(id) {
  const a = acts[id];
  if (!a) return;
  try {
    const body = { activityId: a.id };
    if (a.verification_type === "qr_event") {
      body.eventCode = prompt("Enter the event code");
      if (body.eventCode == null) return;
    }
    if (["photo", "photo_admin"].includes(a.verification_type)) {
      const f = await new Promise(r => { const i = document.createElement("input"); i.type = "file"; i.accept = "image/*"; i.capture = "environment"; i.onchange = () => r(i.files[0]); i.oncancel = () => r(null); i.click(); });
      if (!f) return;
      if (f.size > 10 * 1024 * 1024) return say("That photo is over 10 MB. Please pick a smaller one.", 1);
      const ext = ({ "image/png": "png", "image/webp": "webp", "image/heic": "heic", "image/heif": "heif" })[f.type] || "jpg";
      body.proofPath = `${me.id}/${crypto.randomUUID()}.${ext}`;
      const up = await db.storage.from("proofs").upload(body.proofPath, f, { contentType: f.type });
      if (up.error) throw up.error;
    }
    const r = await api("/api/submissions", body);
    say(r.xp ? `+${r.xp} XP!` : "Sent. XP arrives once an admin verifies it.");
  } catch (e) { say(e.message, 1); }
}
async function ranks() {
  const { data } = await db.rpc("get_leaderboard", { p_period: "all", p_limit: 50 });
  $("app").innerHTML = `<h2>Leaderboard</h2>` + ((data||[]).map(r => `<div class="card row"><b>${r.rank}</b><span style="flex:1;margin-left:.6rem">${esc(r.display_name)}<br><span class="mute">${esc(r.department)}</span></span><b>${r.xp} XP</b></div>`).join("") || `<p class="mute">No XP earned yet. Be the first.</p>`);
}
async function cert() {
  const { data } = await db.from("certificates").select("*").eq("user_id", me.id);
  $("app").innerHTML = `<h2>Annual certificate</h2>` + ((data||[]).map(c => `<div class="card" style="text-align:center;border:3px double var(--pri)"><div class="mute">GreenXP</div><h2>Certificate of ${esc(c.tier)}</h2><p>${esc(me.full_name)} · ${esc(me.usn)}</p>
  <p>${c.xp_earned} verified XP · ${c.activities_count} activities · est. ${c.estimated_co2e} kg CO₂e*</p><b>ID: ${esc(c.certificate_code)}</b><p class="mute" style="font-size:.75rem">*Estimate based on GreenXP's methodology. Points are not carbon credits.</p><button class="s" onclick="window.print()">Print / save as PDF</button></div>`).join("") || `<p class="mute">Certificates are issued at year end for students with 100+ verified XP.</p>`) +
  `<h3>Verify a certificate</h3><div class="card"><input id="vc" placeholder="Certificate ID"><button class="s" onclick="verifyCert()">Verify</button><p id="vr"></p></div>`;
}
async function verifyCert() {
  const { data } = await db.rpc("verify_certificate", { p_code: $("vc").value }); const r = data && data[0];
  $("vr").innerHTML = r ? `<b>${esc(r.status).toUpperCase()}</b>: ${esc(r.student_name)}, ${esc(r.tier)}, ${esc(r.academic_year)}, ${esc(r.college)}` : "Not found";
}
async function admin() {
  $("app").innerHTML = `<div id="ls"></div><h2>Verification queue</h2><p id="msg" class="mute">Loading…</p><div id="q"></div><p><button class="o" onclick="issueAll()">Issue year-end certificates</button></p>`;
  db.rpc("lifestyle_summary").then(({ data: s }) => {
    if (!s || !s.responses) return;
    $("ls").innerHTML = `<h2>Student lifestyle baseline</h2><div class="card"><div class="row"><span>${s.responses} students answered</span><b>avg ${(s.avg_total_kg / 1000).toFixed(1)} t CO₂e / year</b></div>` +
      Object.entries(CATS).map(([k, c]) => `<div class="row mute"><span>${c.icon} ${c.label}</span><span>${s.avg[k]} kg</span></div>`).join("") + `</div>`;
  });
  try {
    const q = await api("/api/admin/submissions", null, "GET");
    say(q.length ? "" : "Nothing waiting.");
    $("q").innerHTML = q.map(s => `<div class="card"><b>${esc(s.activities.name)}</b> <span class="pill">+${s.activities.xp_value}</span><br><span class="mute">${esc(s.profiles.full_name)} · ${esc(s.profiles.usn)}</span>
    ${s.proof_url ? `<br><img src="${esc(s.proof_url)}" alt="Proof" style="max-width:100%;max-height:180px;border-radius:10px;margin:.4rem 0">` : ""}<br>
    <button class="s" onclick="review('${s.id}',true)">Approve</button> <button class="s o" onclick="review('${s.id}',false)">Reject</button></div>`).join("");
  } catch (e) { say(e.message, 1); }
}
async function review(id, approve) {
  const reason = approve ? null : prompt("Reason for rejection");
  if (!approve && reason == null) return; // Cancel means "don't reject"
  try { await api(`/api/admin/submissions/${id}/review`, { approve, reason }); admin(); } catch (e) { say(e.message, 1); }
}
async function issueAll() { try { const r = await api("/api/admin/certificates/issue"); say(`${r.issued} certificate(s) issued.`); } catch (e) { say(e.message, 1); } }
init();
</script></body></html>
