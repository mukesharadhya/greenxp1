<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GreenXP</title>
<style>
:root{--bg:#effaf5;--card:#fff;--ink:#0e3b36;--mute:#4f7a73;--line:#cfe9df;--pri:#19b37a;--prid:#0f8a5c;--xp:#ffc83d}
@media(prefers-color-scheme:dark){:root{--bg:#0a1f1c;--card:#12322d;--ink:#e6f6f1;--mute:#8fbdb3;--line:#1f4a43}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
.app{max-width:520px;margin:auto;padding:1rem 1rem 5.5rem}h1,h2,h3{margin:.2rem 0 .5rem}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:.7rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.6rem}.mute{color:var(--mute);font-size:.9rem}
button{font:700 1rem system-ui;border:0;border-radius:12px;padding:.65rem 1rem;background:var(--pri);color:#fff;cursor:pointer;border-bottom:3px solid var(--prid)}
button.o{background:transparent;color:var(--prid);border:2px solid var(--line)}button.s{padding:.35rem .8rem;font-size:.9rem}
input,select{width:100%;font:inherit;padding:.65rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:.2rem 0 .6rem}
.pill{background:var(--xp);color:#4a3500;border-radius:99px;padding:.1rem .6rem;font-weight:700;font-size:.85rem}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:safe center;overflow-x:auto;gap:.3rem;background:var(--card);border-top:2px solid var(--line);padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;color:var(--mute);border:0;padding:.4rem .7rem;flex-shrink:0;white-space:nowrap}.tabs button.on{color:var(--prid);background:var(--line)}
.app.wide{max-width:960px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.6rem;margin-bottom:.7rem}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:.8rem}.stat b{display:block;font-size:1.7rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.7rem}.grid .card{margin:0}
.proof{width:100%;height:190px;object-fit:cover;border-radius:10px;cursor:zoom-in;display:block;margin-bottom:.5rem;background:var(--line)}
.noproof{height:60px;display:grid;place-items:center;border:2px dashed var(--line);border-radius:10px;margin-bottom:.5rem}
.warn{background:#fff3cd;color:#664d03;border-radius:10px;padding:.4rem .6rem;font-size:.9rem;margin:.4rem 0}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:grid;place-items:center;z-index:9;cursor:zoom-out}.lb img{max-width:95vw;max-height:90vh;border-radius:10px}
dialog{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;width:min(420px,92vw)}dialog::backdrop{background:rgba(0,0,0,.5)}
textarea{width:100%;font:inherit;padding:.65rem;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:.2rem 0 .6rem}
.tbl{overflow-x:auto;border:2px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:.55rem .6rem;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card);color:var(--mute);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
td:nth-child(2){white-space:normal;min-width:200px}
tbody tr:nth-child(even):not(.editrow){background:color-mix(in srgb,var(--line) 35%,transparent)}
tbody tr:hover:not(.editrow){background:var(--line)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
td.acts button{margin:.1rem 0}
button.danger{color:#b3261e;border-color:#b3261e}
.err{color:#b3261e;font-weight:700}.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri)}
</style></head>
<body><div class="app" id="app">Loading…</div><nav class="tabs" id="tabs" hidden></nav>
<div class="lb" id="lb" hidden onclick="this.hidden=true"><img alt="Proof photo, full size"></div>
<dialog id="rj"><form method="dialog"><h3>Reason for rejection</h3><p class="mute">The student sees this reason.</p>
  <label for="rjs">Common reasons</label><select id="rjs"><option value="">Choose a reason…</option><option>Photo doesn't show the activity</option><option>Photo is unclear or too dark</option><option>Same photo was used before</option><option>Doesn't meet the activity rules</option></select>
  <label for="rjt">Or write your own</label><textarea id="rjt" rows="3" maxlength="500"></textarea>
  <div class="row"><button value="cancel" class="o">Cancel</button><button value="ok">Reject</button></div></form></dialog>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const db = supabase.createClient(GXP.SUPABASE_URL, GXP.SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const LV = [[0,"Eco Starter","🌱"],[100,"Green Rookie","🍃"],[300,"Green Warrior","🌿"],[600,"Eco Champion","🌳"],[1000,"Planet Hero","🌎"],[2000,"Eco Legend","🏆"]];
let me = null, tab = "home", acts = {};
async function api(path, body, method = "POST") {
  const { data: { session } } = await db.auth.getSession();
  if (!session) throw new Error("Your session has expired. Please log in again.");
  const r = await fetch(GXP.API_URL + path, { method, headers: { "Content-Type": "application/json", Authorization: "Bearer " + session.access_token }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
const say = (m, bad) => { const e = $("msg"); if (e) { e.textContent = m; e.className = bad ? "err" : "mute"; } };
const currentYear = async () => (await db.from("academic_years").select("id").eq("college_id", me.college_id).eq("is_current", true).maybeSingle()).data;

async function init() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) return authScreen();
  me = (await db.from("profiles").select("*").eq("id", session.user.id).maybeSingle()).data;
  if (!me) {
    $("tabs").hidden = true;
    $("app").innerHTML = `<div class="card"><p>Your account is still being set up.</p><button onclick="init()">Try again</button> <button class="o" onclick="db.auth.signOut().then(init)">Log out</button></div>`;
    return;
  }
  // Admins manage the college and go straight to their dashboard; the onboarding steps below are for students.
  if (["admin", "super_admin"].includes(me.role)) { $("tabs").hidden = false; return show("admin"); }
  if (!me.usn || !me.department) return profileScreen();
  if (me.approval_status !== "approved") return approvalScreen();
  me.survey = (await db.from("lifestyle_surveys").select("*").eq("user_id", me.id).maybeSingle()).data;
  if (!me.survey) return surveyScreen();
  // Only a membership for the current academic year unlocks the app.
  const y = await currentYear();
  const { data: m } = y ? await db.from("memberships").select("status").eq("user_id", me.id).eq("academic_year_id", y.id).in("status", ["active", "waived"]).limit(1) : { data: null };
  if (!m || !m.length) return payScreen(y);
  $("tabs").hidden = false; show("home");
}
async function authScreen() {
  $("tabs").hidden = true;
  insts = (await db.from("colleges").select("id,name,city,state,pincode").eq("active", true).order("name")).data || [];
  $("app").innerHTML = `<h1>🌱 GreenXP</h1><p class="mute">Earn XP. Go Green. Make an Impact.</p><div class="stats" id="counters"></div><div class="card">
  <div class="row" style="justify-content:flex-start;margin-bottom:.8rem"><button id="m_login" onclick="authMode('login')">Log in</button><button id="m_signup" class="o" onclick="authMode('signup')">Sign up</button></div>
  <div id="su" hidden>
    <p class="mute">Find your institution by state, city and pincode.</p>
    <label for="f_st">State</label><select id="f_st" onchange="pickInst(1)"></select>
    <div class="row"><span style="flex:1"><label for="f_ci">City</label><select id="f_ci" onchange="pickInst(2)"></select></span>
      <span style="flex:1"><label for="f_pin">Pincode</label><select id="f_pin" onchange="pickInst(3)"></select></span></div>
    <label for="col">Institution</label><select id="col"></select>
    <label for="nm">Full name</label><input id="nm" autocomplete="name"></div>
  <label for="em">Email</label><input id="em" type="email" autocomplete="email">
  <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
  <p><button id="go" onclick="login()">Log in</button></p><p id="msg"></p>
  <p id="su_note" class="mute" hidden>Can't find your institution? Ask your college to contact the GreenXP team.</p></div>`;
  pickInst(0);
  showCounters();
}
// Linked sign-up dropdowns: each choice narrows the next (state → city → pincode → institution).
let insts = [];
function pickInst(changed) {
  const keep = (id, level) => level <= changed ? $(id).value : ""; // keep the changed field and those above it
  const st = keep("f_st", 1), ci = keep("f_ci", 2), pin = keep("f_pin", 3);
  const inSt = insts.filter(c => !st || c.state === st), inCi = inSt.filter(c => !ci || c.city === ci), inPin = inCi.filter(c => !pin || c.pincode === pin);
  const uniq = (list, k) => [...new Set(list.map(c => c[k]).filter(Boolean))].sort();
  const fill = (id, all, values, cur, label = v => v) =>
    $(id).innerHTML = `<option value="">${all}</option>` + values.map(v => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(label(v))}</option>`).join("");
  fill("f_st", "All states", uniq(insts, "state"), st);
  fill("f_ci", "All cities", uniq(inSt, "city"), ci);
  fill("f_pin", "All pincodes", uniq(inCi, "pincode"), pin);
  $("col").innerHTML = `<option value="">${inPin.length ? `Select your institution (${inPin.length})…` : "No institutions match"}</option>` +
    inPin.map(c => `<option value="${c.id}">${esc(c.name)} — ${esc([c.city, c.pincode].filter(Boolean).join(" "))}</option>`).join("");
  if (inPin.length === 1) $("col").value = inPin[0].id;
}
function authMode(m) {
  const up = m === "signup";
  $("su").hidden = $("su_note").hidden = !up;
  $("m_login").className = up ? "o" : ""; $("m_signup").className = up ? "" : "o";
  $("pw").autocomplete = up ? "new-password" : "current-password";
  $("go").textContent = up ? "Create account" : "Log in"; $("go").onclick = up ? signup : login;
  say("");
}
// Live totals on the login page, counting up from zero.
const fmtKg = kg => kg >= 1000 ? `${(kg / 1000).toFixed(kg >= 1e4 ? 0 : 1)} t` : `${kg >= 10 ? Math.round(kg) : kg.toFixed(1)} kg`;
async function showCounters() {
  const { data: s } = await db.rpc("public_stats");
  const box = $("counters");
  if (!s || !box) return;
  const count = n => Math.round(n).toLocaleString("en-IN");
  const items = [["🏫", "Institutions registered", s.institutions, count],
                 ["🎓", "Students registered", s.students, count],
                 ["📋", "Activities listed", s.activities_listed, count],
                 ["⭐", "Activities completed", s.activities, count],
                 ["🌍", "Carbon footprint reduced (CO₂e)", +s.co2e_saved_kg, fmtKg],
                 ["🎖", "Certificates issued", s.certificates, count]];
  box.innerHTML = items.map(([icon, label], i) => `<div class="stat"><span>${icon}</span><b id="ct${i}">0</b><span class="mute" style="font-size:.75rem;text-transform:uppercase;letter-spacing:.04em">${label}</span></div>`).join("");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches, t0 = performance.now(), ms = 1200;
  const step = now => {
    const p = still ? 1 : Math.min(1, (now - t0) / ms), ease = 1 - Math.pow(1 - p, 3);
    items.forEach(([, , v, f], i) => { const el = $("ct" + i); if (el) el.textContent = f(v * ease); });
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
async function signup() {
  if (!$("col").value) return say("Select your institution.", 1);
  if (!$("nm").value.trim()) return say("Enter your full name.", 1);
  if ($("pw").value.length < 6) return say("Use a password of at least 6 characters.", 1);
  const { data, error } = await db.auth.signUp({ email: $("em").value.trim(), password: $("pw").value,
    options: { data: { full_name: $("nm").value.trim(), college_id: $("col").value } } });
  if (error) return say(error.message, 1);
  if (data.session) return init(); // email confirmation is off: straight in
  authMode("login");
  say("Account created. Check your inbox to confirm your email, then log in.");
}
async function login() {
  const { error } = await db.auth.signInWithPassword({ email: $("em").value, password: $("pw").value });
  error ? say(error.message, 1) : init();
}
function profileScreen() {
  $("tabs").hidden = true;
  $("app").innerHTML = `<h2>Your details</h2><div class="card"><p class="mute">Your college admin checks these details before approving your account.</p>
  <label for="usn">USN</label><input id="usn" value="${esc(me.usn)}"><label for="dep">Department</label>
  <select id="dep">${["CSE","ISE","ECE","EEE","ME"].map(d => `<option${me.department === d ? " selected" : ""}>${d}</option>`).join("")}</select>
  <label for="yr">Year</label><input id="yr" type="number" min="1" max="4" value="${me.year || 1}"><label for="ph">Mobile (never shown publicly)</label><input id="ph" value="${esc(me.phone)}">
  <label><input type="checkbox" id="ok" style="width:auto"> I accept the Terms, Privacy and Refund policies and understand points are not carbon credits.</label>
  <p><button onclick="saveProfile()">${me.approval_status === "rejected" ? "Save and ask for review again" : "Continue"}</button></p><p id="msg"></p></div>`;
}
async function saveProfile() {
  if (!$("usn").value.trim() || !$("ok").checked) return say("Add your USN and accept the terms.", 1);
  const { error } = await db.from("profiles").update({ usn: $("usn").value.trim(), department: $("dep").value, year: +$("yr").value, phone: $("ph").value }).eq("id", me.id);
  if (error) return say(error.code === "23505" ? "That USN is already registered. Check it, or contact your college admin." : error.message, 1);
  if (me.approval_status === "rejected") await db.rpc("request_reapproval");
  init();
}
function approvalScreen() {
  $("tabs").hidden = true;
  const rejected = me.approval_status === "rejected";
  $("app").innerHTML = `<h1>🌱 GreenXP</h1><div class="card">` + (rejected
    ? `<h2>❌ Your account wasn't approved</h2>${me.approval_note ? `<p><b>Reason:</b> ${esc(me.approval_note)}</p>` : ""}
       <p class="mute">If your details were wrong, fix them and ask for another review. Otherwise, contact your college's GreenXP admin.</p>
       <p><button onclick="profileScreen()">Fix my details</button></p>`
    : `<h2>⏳ Waiting for approval</h2><p>Thanks, ${esc((me.full_name || "").split(" ")[0] || "there")}! Your college's GreenXP admin will check your details and approve your account.</p>
       <div class="row mute"><span>USN</span><b>${esc(me.usn)}</b></div><div class="row mute"><span>Department</span><span>${esc(me.department)} · Year ${me.year || "-"}</span></div>
       <p class="mute">This usually takes a day or two. You'll be able to continue as soon as you're approved.</p>
       <p><button onclick="init()">Check again</button> <button class="o" onclick="profileScreen()">Edit details</button></p>`) +
    `<p><button class="o s" onclick="db.auth.signOut().then(init)">Log out</button></p></div>`;
}

// Baseline lifestyle questionnaire: [section, [[id, question, [[value, label], ...]], ...]]
const SURVEY = [
  ["🏠 Home", [
    ["household", "How many people share your home (or hostel room)?", [["1","Just me"],["2","2"],["4","3–4"],["6","5 or more"]]],
    ["residence", "Where do you live?", [["hostel","Hostel / PG"],["apartment","Apartment / flat"],["house","Independent house"]]]]],
  ["🚌 Travel", [
    ["mode", "How do you usually travel to college?", [["walk","Walk / cycle"],["public","Bus / metro / train"],["two","Two-wheeler"],["auto","Auto / cab"],["car","Car"]]],
    ["distance", "Typical daily round-trip distance?", [["3","Under 5 km"],["10","5–15 km"],["22","15–30 km"],["40","Over 30 km"]]]]],
  ["⚡ Energy", [
    ["units", "Household electricity use per month?", [["75","Under 100 units (bill under ₹500)"],["150","100–200 units (₹500–1,200)"],["300","200–400 units (₹1,200–3,000)"],["500","Over 400 units (over ₹3,000)"],["0","Don't know"]]],
    ["cooking", "Main cooking fuel where you eat?", [["lpg","LPG cylinder"],["png","Piped gas (PNG)"],["electric","Electric / induction"],["biomass","Wood / biomass"],["mess","I eat at a mess / canteen"]]]]],
  ["🍽 Food", [
    ["diet", "Which best describes your diet?", [["vegan","Vegan"],["veg","Vegetarian"],["egg","Vegetarian + eggs"],["nonveg_some","Non-veg a few times a week"],["nonveg_daily","Non-veg daily"]]],
    ["waste", "How often is food wasted on your plate or at home?", [["rare","Rarely"],["sometimes","Sometimes"],["often","Often"]]],
    ["delivery", "How often do you order food delivery?", [["rare","Rarely"],["weekly","About once a week"],["often","Several times a week"]]]]],
  ["🛍 Shopping", [
    ["clothes", "New clothes bought per year?", [["low","0–5 items"],["mid","6–15 items"],["high","16+ items"]]],
    ["online", "Online orders per month?", [["low","0–2"],["mid","3–8"],["high","9+"]]],
    ["devices", "How often do you replace your phone or laptop?", [["low","Every 4+ years"],["mid","Every 2–3 years"],["high","Every year"]]]]],
  ["💧 Water & waste", [
    ["bath", "How do you usually bathe?", [["bucket","Bucket"],["short","Shower, under 10 min"],["long","Shower, over 10 min"]]],
    ["segregate", "Do you separate wet and dry waste?", [["always","Always"],["sometimes","Sometimes"],["never","Never"]]],
    ["plastic", "How often do you use single-use plastic (bags, bottles, cups)?", [["rare","Rarely"],["sometimes","Sometimes"],["daily","Daily"]]]]]
];
// Footprint categories, with the tip and matching activity categories shown when it is one of a student's biggest.
const CATS = {
  Energy:    { label: "Energy", icon: "⚡", acts: ["Energy"], tip: "Switch off fans, lights and chargers when you leave a room, keep the AC at 24–26 °C, and pick LED and 5-star appliances." },
  Transport: { label: "Transport", icon: "🚌", acts: ["Transport"], tip: "Walk, cycle or take the bus or metro for some trips, and share rides when you can't." },
  Food:      { label: "Food", icon: "🍽", acts: ["Food"], tip: "Take only what you'll eat, try more plant-based meals, and cook or eat at the mess instead of ordering in." },
  Shopping:  { label: "Shopping", icon: "🛍", acts: ["Reuse", "Recycling"], tip: "Buy fewer, longer-lasting clothes, repair before replacing, and recycle old electronics properly." },
  Water:     { label: "Water & waste", icon: "💧", acts: ["Water", "Waste"], tip: "Use a bucket or keep showers short, segregate waste, and carry a reusable bottle and bag." }
};
const INDIA_AVG_T = 1.9; // approx. per-person tonnes CO2e per year in India
const GRID = 0.71; // kg CO2 per kWh, Indian grid average
// Rough yearly kg CO2e per person from the questionnaire, per logging category, using typical Indian emission factors.
function baseline(a) {
  const hh = +a.household;
  const units = +a.units || { hostel: 40, apartment: 50, house: 70 }[a.residence] * hh; // "don't know": typical per-person use
  const cook = { lpg: 340, png: 300, electric: 0, biomass: 400 }; // per household per year
  return {
    transport: +a.distance * 300 * { walk: 0, public: 0.03, two: 0.05, auto: 0.12, car: 0.17 }[a.mode], // ~300 travel days
    electricity: units * 12 * GRID / hh,
    cooking: a.cooking === "mess" ? 100 : cook[a.cooking] / hh,
    food: { vegan: 700, veg: 900, egg: 1000, nonveg_some: 1200, nonveg_daily: 1600 }[a.diet]
      + { rare: 0, sometimes: 50, often: 150 }[a.waste] + { rare: 0, weekly: 50, often: 150 }[a.delivery],
    shopping: { low: 50, mid: 150, high: 350 }[a.clothes] + { low: 20, mid: 60, high: 150 }[a.online] + { low: 50, mid: 100, high: 250 }[a.devices],
    waste: { bucket: 20, short: 40, long: 80 }[a.bath] + { always: 30, sometimes: 80, never: 150 }[a.segregate] + { rare: 10, sometimes: 40, daily: 100 }[a.plastic]
  };
}
// The questionnaire's own five-category view (stored with the survey and used for the admin averages).
function footprint(a) {
  const b = baseline(a);
  const f = { Energy: b.electricity + b.cooking, Transport: b.transport, Food: b.food, Shopping: b.shopping, Water: b.waste };
  for (const k in f) f[k] = Math.round(f[k]);
  return f;
}
function surveyScreen() {
  const prev = me.survey?.answers || {};
  $("app").innerHTML = `<h2>Your green baseline</h2><p class="mute">15 quick questions about your everyday life. We use them to estimate your carbon footprint and show where you can make the biggest difference.</p>` +
    SURVEY.map(([title, qs]) => `<div class="card"><h3>${title}</h3>` + qs.map(([id, q, opts]) =>
      `<label for="q_${id}">${q}</label><select id="q_${id}"><option value="">Choose…</option>${opts.map(([v, t]) => `<option value="${v}"${prev[id] === v ? " selected" : ""}>${t}</option>`).join("")}</select>`).join("") + `</div>`).join("") +
    `<p><button onclick="saveSurvey()">See my analysis</button>${me.survey ? ` <button class="o" onclick="init()">Cancel</button>` : ""}</p><p id="msg"></p>`;
}
async function saveSurvey() {
  const a = {};
  for (const [, qs] of SURVEY) for (const [id] of qs) a[id] = $("q_" + id).value;
  if (Object.values(a).some(v => !v)) return say("Please answer every question.", 1);
  const f = footprint(a), total = Object.values(f).reduce((x, y) => x + y, 0);
  const { data, error } = await db.from("lifestyle_surveys")
    .upsert({ user_id: me.id, answers: a, footprint: f, total_kg: total, updated_at: new Date().toISOString() }).select().single();
  if (error) return say(error.message, 1);
  me.survey = data;
  analysisScreen();
}
async function analysisScreen() {
  const f = me.survey.footprint, t = me.survey.total_kg / 1000;
  const max = Math.max(1, ...Object.keys(CATS).map(k => f[k]));
  const top = Object.keys(CATS).sort((x, y) => f[y] - f[x]).slice(0, 2);
  const { data: acts } = await db.from("activities").select("name,category,xp_value").eq("active", true).in("category", top.flatMap(k => CATS[k].acts));

function estimate(logs, base) {

    const days = !L.length ? 0 : c.event

    else if (base[cat] != null) out[cat] = { kg: base[cat], src: L.length ? "questionnaire (log at least a week)" : "questionnaire estimate", logs: L };

    for (const [field, names] of Object.entries(HEADERS)) col[field] = keys.find(k => names.includes(k.trim().toLowerCase()));
    const missing = ["name", "city", "state", "pincode"].filter(f => !col[f]);
    if (missing.length) throw new Error(`Couldn't find these columns: ${missing.map(f => HEADERS[f][0]).join(", ")}. Use the template's headings.`);
    if (raw.length > 500) throw new Error(`The file has ${raw.length} rows; upload at most 500 at a time.`);
    bulkRows = raw.map((r, i) => {
      const stateIn = String(r[col.state]).trim();
      return { line: i + 2, name: String(r[col.name]).trim(), city: String(r[col.city]).trim(), stateIn, state: normState(stateIn),
        pincode: String(r[col.pincode]).replace(/\s/g, ""), fee: col.fee ? String(r[col.fee]).replace(/[₹,\s]/g, "") : "" };
    }).filter(v => v.name || v.city || v.stateIn || v.pincode); // skip fully blank lines
    if (!bulkRows.length) throw new Error("The file has headings but no institutions under them.");
    // Drop duplicates straight away: names that already exist, and repeats within the file (the first is kept).
    const existing = new Set(instList.map(c => c.name.trim().toLowerCase())), seen = new Set(), dropped = [];
    bulkRows = bulkRows.filter(r => {
      const key = r.name.trim().toLowerCase();
      if (!key) return true;
      if (existing.has(key) || seen.has(key)) { dropped.push(`${r.name} (row ${r.line}, ${existing.has(key) ? "already exists" : "repeated in file"})`); return false; }
      seen.add(key); return true;
    });
    bulkDropped = dropped;
    renderBulk();
  } catch (e) { m.className = "err"; m.textContent = e.message; }
}
let bulkDropped = [];
const validPin = p => /^[1-9][0-9]{5}$/.test(p);
// Re-checks every unsaved row. Only the name is required (and it must be unique); missing or invalid city,
// state, pincode or fee don't block saving: they're saved empty (fee ₹199) and listed as notes to fix later.
function validateBulk() {
  const existing = new Set(instList.map(c => c.name.trim().toLowerCase())), seen = new Set();
  for (const r of bulkRows) {
    if (r.result === "created") continue;
    const key = r.name.trim().toLowerCase(), p = [], n = [];
    if (!key) p.push("name missing");
    else if (existing.has(key)) p.push("already exists");
    else if (seen.has(key)) p.push("repeated in this file");
    if (key) seen.add(key);
    if (r.serverError) p.push(r.serverError);
    if (!r.city.trim()) n.push("no city");
    if (!r.state) n.push(r.stateIn ? `state "${r.stateIn}" not recognised` : "no state");
    if (!validPin(r.pincode)) n.push(r.pincode ? `pincode "${r.pincode}" not 6 digits` : "no pincode");
    if (r.fee !== "" && !(+r.fee >= 0)) n.push("fee not a number, ₹199 used");
    r.problem = p.join("; "); r.note = n.join(", ");
  }
}
const cell = (i, f, v, attrs = "") => `<input value="${esc(v)}" ${attrs} oninput="editBulk(${i},'${f}',this.value)" aria-label="${f} for row ${i + 1}" style="margin:0;padding:.35rem .5rem;min-width:0">`;
function renderBulk() {
  validateBulk();
  const bar = id => `<div class="row" style="justify-content:flex-start;flex-wrap:wrap;margin:.5rem 0"><button id="${id}" onclick="saveBulk(this)"></button>
    <button class="o" onclick="cancelBulk()">Cancel</button></div>`;
  $("bq").innerHTML = bar("bsave1") + `<div class="tbl" style="max-height:420px;overflow:auto"><table><thead><tr><th>Row</th><th>Institution name</th><th>City</th><th>State</th><th>Pincode</th><th>Fee (₹)</th><th>Status</th><th></th></tr></thead><tbody>` +
    bulkRows.map((r, i) => r.result === "created"
      ? `<tr><td class="mute">${r.line}</td><td>${esc(r.name)}</td><td>${esc(r.city)}</td><td>${esc(r.state)}</td><td>${esc(r.pincode)}</td><td>${r.fee === "" ? 199 : esc(r.fee)}</td><td>✅ Saved</td><td></td></tr>`
      : `<tr><td class="mute">${r.line}</td><td style="min-width:220px">${cell(i, "name", r.name)}</td><td>${cell(i, "city", r.city, 'list="citylist"')}</td>
        <td><select onchange="editBulk(${i},'state',this.value)" aria-label="state for row ${i + 1}" style="margin:0;padding:.35rem .5rem">
          <option value="">${r.stateIn && !r.state ? "⚠ " + esc(r.stateIn) : "Select…"}</option>${INDIAN_STATES.map(s => `<option${s === r.state ? " selected" : ""}>${s}</option>`).join("")}</select></td>
        <td>${cell(i, "pincode", r.pincode, 'inputmode="numeric" maxlength="6" style="width:7.5em"')}</td><td>${cell(i, "fee", r.fee, 'inputmode="numeric" placeholder="199" style="width:5.5em"')}</td>
        <td id="bs_${i}" style="white-space:normal;min-width:160px"></td>
        <td><button class="s o" onclick="bulkRows.splice(${i},1);renderBulk()" aria-label="Remove row ${r.line}" title="Remove this row">✕</button></td></tr>`).join("") +
    `</tbody></table></div>` + bar("bsave2");
  updateBulkStatus();
}
function editBulk(i, field, value) {
  const r = bulkRows[i];
  r[field] = field === "pincode" ? value.replace(/\s/g, "") : value;
  if (field === "state") r.stateIn = value;
  r.serverError = "";
  validateBulk(); updateBulkStatus();
}
// Updates the status column, summary and Save buttons without redrawing the inputs (so typing isn't interrupted).
function updateBulkStatus() {
  bulkRows.forEach((r, i) => { const s = $("bs_" + i); if (s) s.innerHTML = r.problem ? `<span class="err" style="font-weight:400">❌ ${esc(r.problem)}</span>`
    : r.note ? `✔ Ready <span class="mute" style="font-size:.8rem">· ⚠ ${esc(r.note)} – saved empty, fill in later with Edit</span>` : "✔ Ready"; });
  const ready = bulkRows.filter(r => !r.problem && r.result !== "created").length, bad = bulkRows.filter(r => r.problem).length;
  const saved = bulkRows.filter(r => r.result === "created").length, incomplete = bulkRows.filter(r => !r.problem && r.result !== "created" && r.note).length;
  $("bmsg").className = bad ? "err" : "mute";
  $("bmsg").innerHTML = esc((saved ? `✅ ${saved} saved. ` : "") + (ready || bad
    ? `${ready} ready to save${incomplete ? ` (${incomplete} with missing details you can add later)` : ""}${bad ? `, ${bad} need a name or a different name – edit or remove them with ✕` : ""}.` : "All done.")) +
    (bulkDropped.length ? `<br><span class="mute">🗑 ${bulkDropped.length} duplicate${bulkDropped.length > 1 ? "s" : ""} removed from the file: ${esc(bulkDropped.join("; "))}</span>` : "");
  for (const id of ["bsave1", "bsave2"]) {
    const b = $(id); if (!b) continue;
    b.disabled = !ready;
    b.textContent = ready ? `💾 Save ${ready} institution${ready > 1 ? "s" : ""}` : bad ? "💾 Save (rows marked ❌ need a name first)" : "💾 Nothing left to save";
  }
}
function cancelBulk() {
  if (bulkRows.some(r => r.result !== "created") && !confirm("Discard this upload? Rows that aren't saved yet will be lost.")) return;
  bulkRows = []; bulkDropped = []; $("bq").innerHTML = ""; $("bmsg").textContent = "";
}
async function saveBulk(btn) {
  const ready = bulkRows.filter(r => !r.problem && r.result !== "created");
  if (!ready.length) return;
  if (!confirm(`Save ${ready.length} institution${ready.length > 1 ? "s" : ""}? Each gets this year's calendar, activities and certificate rules, and appears in the sign-up list.`)) return;
  document.querySelectorAll("#bsave1,#bsave2").forEach(b => { b.disabled = true; b.textContent = "Saving…"; });
  try {
    const r = await api("/api/super/institutions/bulk", { rows: ready.map(({ name, city, state, pincode, fee }) =>
      ({ name: name.trim(), city: city.trim(), state: state || "", pincode: validPin(pincode) ? pincode : "", fee: fee !== "" && +fee >= 0 ? +fee : 199 })) });
    r.results.forEach((res, i) => { if (res.ok) ready[i].result = "created"; else ready[i].serverError = res.error; });
    const keep = bulkRows, dropKeep = bulkDropped;
    await institutionsView(); // refresh the institutions table, then bring the upload preview back
    bulkRows = keep; bulkDropped = dropKeep; renderBulk();
    $("bq").scrollIntoView({ behavior: "smooth", block: "start" });
  } catch (e) { $("bmsg").className = "err"; $("bmsg").textContent = e.message; updateBulkStatus(); }
}
async function deleteInst(id) {
  const c = instList.find(x => x.id === id);
  if (c.students) return say(`${c.name} has ${c.students} student${c.students > 1 ? "s" : ""}, so it can't be deleted. Use Switch off to hide it from sign-up instead.`, 1);
  const typed = prompt(`This permanently deletes ${c.name}, with its academic year, fee, activities and certificate rules.\n\nType the institution's name to confirm:`);
  if (typed == null) return;
  if (typed.trim().toLowerCase() !== c.name.trim().toLowerCase()) return say("The name didn't match, so nothing was deleted.", 1);
  try { await api(`/api/super/institutions/${id}/delete`, {}); await institutionsView(); say(`🗑 ${c.name} deleted.`); }
  catch (e) { say(e.message, 1); }
}
function editInst(id) {
  const c = instList.find(x => x.id === id), p = "e_" + id.slice(0, 8) + "_";
  document.querySelectorAll("tr.editrow").forEach(r => r.remove());
  $("ir_" + id).insertAdjacentHTML("afterend", `<tr class="editrow"><td colspan="10"><div style="max-width:520px"><b>Edit ${esc(c.name)}</b>${instFields(p, c)}
    <p><button class="s" onclick="saveInst('${id}','${p}')">Save</button> <button class="s o" onclick="this.closest('tr').remove()">Cancel</button></p><p id="${p}msg"></p></div></td></tr>`);
}
async function saveInst(id, p) {
  const v = readInst(p), m = $(p + "msg");
  if (typeof v === "string") { m.className = "err"; m.textContent = v; return; }
  try { await api(`/api/super/institutions/${id}`, v); await institutionsView(); say(`✅ ${v.name} updated.`); }
  catch (e) { m.className = "err"; m.textContent = e.message; }
}
async function addInstitution() {
  const m = $("imsg"), v = readInst("in_"), fee = $("in_fee").value;
  if (typeof v === "string") { m.className = "err"; m.textContent = v; return; }
  if (fee === "" || !(+fee >= 0)) { m.className = "err"; m.textContent = "Enter the yearly fee (0 or more)."; return; }
  try {
    await api("/api/super/institutions", { ...v, fee });
    await institutionsView();
    $("imsg").className = "mute"; $("imsg").textContent = `✅ ${v.name} added. Students can now choose it when signing up.`;
  } catch (e) { m.className = "err"; m.textContent = e.message; }
}
async function makeAdmin(id) {
  const c = instList.find(x => x.id === id);
  const email = (prompt(`Make someone an admin of ${c.name}.\nThey'll be able to approve its students and activities.\n\nEmail they signed up with:`) || "").trim();
  if (!email) return;
  try { await api(`/api/super/institutions/${id}/admin`, { email }); await institutionsView(); say(`✅ ${email} is now an admin.`); }
  catch (e) { say(e.message, 1); }
}
async function setActive(id, active) {
  if (!active && !confirm("Switch off this institution? It will disappear from the sign-up list. Existing accounts keep working.")) return;
  try { await api(`/api/super/institutions/${id}/active`, { active }); institutionsView(); } catch (e) { say(e.message, 1); }
}
async function issueAll() {
  if (!confirm("Issue year-end certificates now?")) return;
  try { const r = await api("/api/admin/certificates/issue"); $("cmsg").textContent = `${r.issued} certificate(s) issued.`; }
  catch (e) { $("cmsg").className = "err"; $("cmsg").textContent = e.message; }
}
init();
